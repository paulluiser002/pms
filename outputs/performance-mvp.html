function cwWorkflow(c){
 const content=[c.components.goals?'Goals Performance':null,c.components.behavioral?'Behavioral Performance':null].filter(Boolean).join(' + ')||'No evaluation components configured';
 return cwSection('Assessment Stages & Deadlines','Set the deadline in each stage card below. Stages unlock per employee after the preceding assessment is submitted.',`<ol class="cw-sequence">${c.stages.map((stage,i)=>`<li><span>${i+1}</span>${esc(cwStageLabel(stage))}</li>`).join('')}</ol><div id="cw-workflow">${cwInline('cw-workflow')}${c.stages.map((stage,i)=>`<section class="cw-stage" id="cw-stage-${stage.id}" tabindex="-1"><div class="cw-stage-header"><h4>Stage ${i+1} · ${esc(cwStageLabel(stage))}</h4>${['Peer','Upward'].includes(stage.type)?`<div class="cw-stage-actions"><button type="button" aria-label="Move stage ${i+1} up" ${!['Peer','Upward'].includes(c.stages[i-1]?.type)?'disabled':''} onclick="cwMoveOptionalStage(${i},-1)">↑</button><button type="button" aria-label="Move stage ${i+1} down" ${!['Peer','Upward'].includes(c.stages[i+1]?.type)?'disabled':''} onclick="cwMoveOptionalStage(${i},1)">↓</button><button type="button" onclick="cwRemoveOptionalStage(${i})">Remove</button></div>`:''}</div><div class="cw-grid cw-stage-fields"><label for="cw-deadline-${stage.id}"><span class="hr-field-label">${esc(cwStageLabel(stage))} Deadline <span class="required">*</span></span><input id="cw-deadline-${stage.id}" type="date" required aria-label="${esc(cwStageLabel(stage))} Deadline" value="${stage.deadline}" min="${i?c.stages[i-1].deadline:c.start}" oninput="cwSetStage(${i},'deadline',this.value)"></label><label for="cw-content-${stage.id}"><span class="hr-field-label">Assessment Content</span><input id="cw-content-${stage.id}" class="cw-stage-content" type="text" disabled readonly value="${esc(content)}"></label></div>${cwStageAssignments(c,stage)}${cwInline('cw-stage-'+stage.id)}</section>`).join('')}</div><button type="button" onclick="urWizard.stages.push({id:urUid('stage'),name:'Peer Assessment',type:'Peer',deadline:'',reviewer:'',reviewers:{}});cwTouch();render()">+ Add Assessment Stage</button><p class="cw-help">Final assessment deadline: ${cwDateValid(c.stages.at(-1)?.deadline)?date(c.stages.at(-1).deadline):'Not configured'}. A missed deadline does not unlock the next stage.</p>`)+cwRelease(c);
}

function cwPolicyLabel(c){return c.scoring.behavioral==='average'?'Average eligible observed ratings; anonymous perspectives require the minimum response count':c.scoring.behavioral?`${c.scoring.behavioral} assessment is authoritative`:'Not configured'}
function cwRelease(c){const types=c.stages.map(s=>s.type);return cwSection('Result Release','Manual release by HR Administrator.',`<p>HR finalizes completed assessments, then releases the results. Neither action takes place during cycle setup.</p><details class="cw-position-mapping"><summary>Feedback Visibility</summary><label class="cw-previous-access">Previous-stage information for evaluators<select onchange="urWizard.releasePolicy.previousStages=this.value;cwTouch()"><option value="metadata" ${c.releasePolicy.previousStages!=='responses'?'selected':''}>Stage status and submission metadata only</option><option value="responses" ${c.releasePolicy.previousStages==='responses'?'selected':''}>Permitted named responses from prior stages</option></select></label>${types.includes('Peer')?`<label class="cw-check"><input type="checkbox" ${c.anonymousPeer?'checked':''} onchange="cwSet('anonymousPeer',this.checked)">Protect anonymous Peer Feedback</label>`:''}${types.includes('Upward')?`<label class="cw-check"><input type="checkbox" ${c.anonymousUpward?'checked':''} onchange="cwSet('anonymousUpward',this.checked)">Protect anonymous Upward Feedback</label>`:''}${types.some(t=>['Peer','Upward'].includes(t))?`<label id="cw-confidentiality">Minimum anonymous responses <span class="required">*</span><input type="number" min="2" max="10" value="${c.threshold}" oninput="cwSet('threshold',Number(this.value))">${cwInline('cw-confidentiality')}</label>`:''}</details>${cwInline('cw-release')}`)}

function cwSummary(c){const errors=cwLaunchErrors(c),ready=c.participants.filter(id=>cwReady(c,id)).length,t=UR.templates.find(t=>t.id===c.behavioralTemplate);return cwSection('Cycle Overview','',`<div class="cw-summary-pairs">${[['Cycle Name',c.name],['Review Type',c.type],['Evaluation Period',date(c.periodStart)+' – '+date(c.periodEnd)],['Assessment Start Date',date(c.start)]].map(([k,v])=>`<div><small>${k}</small><b>${esc(String(v))}</b></div>`).join('')}</div>`, '<button class="textbtn" onclick="cwGoStep(1,true)">Edit Cycle Details</button>')+cwSection('Selected Participants & Goal Readiness',`${ready} of ${c.participants.length} participants ready.`,cwReadiness(c,false),'<button class="textbtn" onclick="cwGoStep(3,true)">Review Evaluation Setup</button>')+cwSection('Behavioral Assessment Template','',`<p><b>${esc(t?.name||'No default template selected')}</b>${t?' · Version '+t.version+' · '+t.questions.length+' questions':''}</p>${Object.entries(c.behaviorByPosition).filter(([position,id])=>id&&c.participants.some(subject=>cwPosition(subject)===position)).map(([position,id])=>{const mapped=UR.templates.find(t=>t.id===id);return `<p>${esc(position)}: ${esc(mapped?.name||'Template unavailable')}${mapped?' · v'+mapped.version:''}</p>`}).join('')}`)+cwSection('Assessment Workflow','',`<div class="tablewrap"><table><thead><tr><th scope="col">SEQUENCE</th><th scope="col">STAGE</th><th scope="col">EMPLOYEE → EVALUATOR</th><th scope="col">DEADLINE</th></tr></thead><tbody>${c.stages.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.name)}</td><td>${c.participants.map(id=>`${esc(urPerson(id).name)} → ${esc(urPerson(pdStageReviewer(s,id)).name)}`).join('<br>')}</td><td>${cwDateValid(s.deadline)?date(s.deadline):'Missing deadline'}</td></tr>`).join('')}</tbody></table></div><p>Result release: Manual release by HR Administrator.</p>`,'<button class="textbtn" onclick="cwGoStep(4,true)">Edit Assessment Workflow</button>')+(errors.length?cwSection('Validation Summary','',`<div class="cw-validation" role="alert"><b>Resolve ${errors.length} blocking issue${errors.length===1?'':'s'}</b><ul>${errors.map(e=>`<li><button class="textbtn" onclick="cwGoError(${e.step},'${esc(e.field)}')">Step ${e.step} · ${esc(e.message)}</button></li>`).join('')}</ul></div>`):cwNotice('Ready to launch. Assessments open sequentially; HR finalization and manual release follow completion.'))}

urWizardPage=function(){if(!cwV2(urWizard))return cwBase.wizard();const c=urWizard,errors=urStep===5?cwLaunchErrors(c):[],body=[cwCycleDetails,cwParticipants,cwSetup,cwWorkflow,cwSummary][urStep-1](c);return pdBack("urGoTab('Cycles')",'Back to Cycles')+pdHead('Create Review Cycle','Connect employee goals, evaluation components, and sequential assessments.')+`<div class="urstepper cw-stepper" aria-label="Review cycle steps">${cwSteps.map((label,i)=>`<button class="${urStep===i+1?'active':i+1<cwMaxStep?'done':''}" ${urStep===i+1?'aria-current="step"':''} onclick="cwGoStep(${i+1})"><span>${i+1<cwMaxStep?'✓':i+1}</span>${label}</button>`).join('')}</div><section class="panel cw-wizard"><div class="cw-wizard-title"><small>STEP ${urStep} OF 5</small><h2>${cwSteps[urStep-1]}</h2></div><div class="cw-wizard-body">${cwErrorSummary()}${body}</div><footer class="cw-footer"><span>${c.participants.length} selected · Changes ${urDirty?'not saved':'saved or unchanged'}</span><div><button onclick="urSaveCycleDraft()">Save as Draft</button>${urStep>1?`<button onclick="cwGoStep(${urStep-1})">Back</button>`:''}${urStep<5?`<button class="primary" onclick="cwGoStep(${urStep+1})">Continue</button>`:`<button class="primary" ${errors.length?'disabled':''} onclick="urConfirmCycle('${c.start>urToday?'Scheduled':'Active'}')">${c.start>urToday?'Schedule':'Launch'} Cycle</button>`}</div></footer></section>`};

/* A single set of linked goals supplies every assessment stage and the consolidated result. */
function cwFreezeBehavior(c){
 c.behaviorByEmployee=Object.fromEntries(c.participants.map(id=>[id,c.components.behavioral?urClone(cwBehaviorTemplate(c,id)):null]));
}
function cwBehaviorGenerationErrors(c){
 if(!c.components.behavioral)return [];
 // Initial illustrative fixtures have no prior approved snapshot; freeze them once at creation.
 if(c.sample&&c.status!=='Scheduled'&&!c.behaviorSnapshots&&!c.behaviorByEmployee)cwFreezeBehavior(c);
 if(!c.behaviorByEmployee){
  c.behaviorByEmployee={};
  for(const id of c.participants){const position=c.performanceRecords?.[id]?.employee?.position||c.resultSnapshots?.[id]?.employee?.position||c.goalTemplateSnapshots?.[id]?.position||cwPosition(id),snapshot=c.behaviorSnapshots?.[position];if(snapshot)c.behaviorByEmployee[id]=urClone(snapshot)}
 }
 return c.participants.filter(id=>!c.behaviorByEmployee[id]||!Array.isArray(c.behaviorByEmployee[id].questions)).map(id=>urPerson(id).name+': frozen Behavioral Assessment Template is missing. Contact HR to recover the original frozen snapshot or cancel and replace this cycle. Assessments stay blocked until the original evidence is recovered.');
}
function cwGenerate(c){if(UR.assignments.some(a=>a.cycle===c.id))return;c.generationErrors=cwBehaviorGenerationErrors(c);if(c.generationErrors.length)return;for(const stage of c.stages)for(const subject of c.participants){const template=c.components.behavioral?c.behaviorByEmployee[subject]:{id:'goals-only',name:'Goals Performance',description:'',version:1,sections:[],questions:[]};UR.assignments.push({id:urUid('rev'),cycle:c.id,subject,reviewer:pdStageReviewer(stage,subject),type:stage.type,stage:stage.id,deadline:stage.deadline,template:urClone(template),state:'Not Started',answers:{},feedback:'',updated:urToday})}}
urGenerateAssignments=function(c){return cwV2(c)?cwGenerate(c):cwBase.generate(c)};
urCommitCycle=function(state){if(!cwV2(urWizard))return cwBase.commit(state);if(!urHr()||!['Active','Scheduled'].includes(state)||cwLaunchErrors(urWizard).length)return;const c=urClone(urWizard);if(state==='Active'&&(c.start>urToday||c.stages.at(-1).deadline<urToday)||state==='Scheduled'&&c.start<=urToday)return;if(UR.assignments.some(a=>a.cycle===c.id))return;c.status=state;c.name=c.name.trim();if(c.components.goals)for(const subject of c.participants)for(const link of cwLinks(c,subject)){const g=cwGoal(link);g.cycleId??=c.id;g.evaluationCycles=[...new Set([...(g.evaluationCycles||[]),c.id])];g.evaluationTargets??={};g.evaluationTargets[c.id]={target:link.target,unit:link.unit}}c.deadline=c.stages.at(-1).deadline;c.weights=cwWeights(c);c.groups=[...new Set(c.stages.map(s=>s.type))];c.evaluators=c.stages.flatMap(s=>c.participants.map(subject=>({subject,type:s.type,reviewer:pdStageReviewer(s,subject)})));c.templates={};c.behaviorSnapshots=Object.fromEntries([...new Set(c.participants.map(cwPosition))].map(position=>{const id=c.participants.find(id=>cwPosition(id)===position);return [position,c.components.behavioral?urClone(cwBehaviorTemplate(c,id)):null]}));cwFreezeBehavior(c);c.goalTemplateSnapshots=Object.fromEntries(c.participants.map(id=>[id,c.components.goals?urClone(cwGoalTemplate(c,id)):null]));const index=UR.cycles.findIndex(x=>x.id===c.id);if(index>=0)UR.cycles[index]=c;else UR.cycles.push(c);if(state==='Active')cwGenerate(c);UR.draftCycle=null;urDirty=false;urAudit('Connected review cycle '+state+': '+c.id);closeModal();urDetail=c.id;urDetailTab='Overview';urTab='Cycles';urScreen='cycle';render();toast('Cycle saved; assessments follow the configured sequence')};
function cwGoalActual(g,c){return g?.evaluationActuals?.[c.id]?.value??null}
function cwGoalSignature(g,c){return JSON.stringify([pmsGoalOwner(g),g.name,g.due,g.progress,pmsMilestoneSignature(pmsGoalMilestones(g)),cwGoalActual(g,c)])}
function cwVerification(g,c){const v=g?.goalVerifications?.[c.id];if(!v)return 'Not submitted';return v.signature!==cwGoalSignature(g,c)?'Changed — verify again':v.state}
function cwCanManageVerification(g,c){return !!g&&cwV2(c)&&c.status==='Active'&&!c.released&&viewRole==='Manager'&&pmsGoalInScope(g)&&urTeam(pmsGoalOwner(g))&&UR.assignments.some(a=>a.cycle===c.id&&a.subject===pmsGoalOwner(g)&&a.type==='Manager'&&a.reviewer===urUser()&&pdUnlocked(a)&&!['Submitted','Completed'].includes(a.state))}
function cwCanRecord(g,c){return !!g&&cwV2(c)&&['Draft','Active'].includes(c.status)&&!c.released&&pmsGoalInScope(g)&&pmsGoalOwner(g)===urUser()&&cwLinks(c,pmsGoalOwner(g)).some(l=>String(l.goalId)===String(g.id))}
function cwRecordActual(id,cycle){const g=data.goals.find(g=>String(g.id)===String(id)),c=urCycle(cycle);if(!cwCanRecord(g,c))return;const link=cwLinks(c,pmsGoalOwner(g)).find(l=>String(l.goalId)===String(id));modal('Record Goal Achievement',g.name,`<form onsubmit="event.preventDefault();cwSaveActual('${id}','${cycle}',this)"><div class="modalbody"><p>Progress remains ${g.progress}%. Recording an actual result does not change progress or automatically verify completion.</p><label>Actual Result (${esc(link.unit)}) <span class="required">*</span><input name="actual" type="number" min="0" step="any" required value="${cwGoalActual(g,c)??''}"></label><p>${Number(g.progress)===100?'Saving submits the completed goal for Manager verification.':'Saving reports achievement for Manager review. Submit completion after the goal reaches 100%.'}</p><div id="cwActualError" class="cw-error" role="alert"></div></div><div class="modalfoot"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">${Number(g.progress)===100?'Submit for Verification':'Save Recorded Actual'}</button></div></form>`,'')}
function cwSaveActual(id,cycle,form){const g=data.goals.find(g=>String(g.id)===String(id)),c=urCycle(cycle),raw=new FormData(form).get('actual');if(!cwCanRecord(g,c))return;const value=Number(raw);if(raw==null||raw===''||!Number.isFinite(value)||value<0){$('#cwActualError').textContent='Enter a valid nonnegative actual result.';return}g.evaluationActuals??={};g.evaluationActuals[c.id]={value,by:urUser(),at:pdNow()};cwVerificationEvent(g,c,Number(g.progress)===100?'Pending':'Reported','');urAudit('Goal actual recorded: '+g.id+' / '+c.id);closeModal();render();toast('Goal achievement recorded for Manager review')}
function cwVerificationEvent(g,c,state,reason){g.goalVerifications??={};const old=g.goalVerifications[c.id];g.goalVerifications[c.id]={state,reason,by:urUser(),at:pdNow(),signature:cwGoalSignature(g,c),completionVerified:state==='Verified'&&Number(g.progress)===100,history:[...(old?.history||[]),{state,reason,by:urUser(),at:pdNow()}]}}
function cwVerifyGoal(id,cycle,action){const g=data.goals.find(g=>String(g.id)===String(id)),c=urCycle(cycle);if(!cwCanManageVerification(g,c)||!['Verified','Returned'].includes(action))return;modal(action==='Verified'?'Verify Goal Achievement?':'Return Goal for Revision',g.name,`<form onsubmit="event.preventDefault();cwConfirmVerification('${id}','${cycle}','${action}',this)"><div class="modalbody"><p>Recorded actual: ${cwGoalActual(g,c)??'Not recorded'} · Progress: ${g.progress}%.</p>${action==='Returned'?'<label>Reason for Revision <span class="required">*</span><textarea name="reason" required maxlength="2000" rows="3"></textarea></label>':'<p>Verify the recorded actual result against supporting evidence. This does not alter the employee\'s goal progress.</p>'}<div id="cwVerifyError" class="cw-error" role="alert"></div></div><div class="modalfoot"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">${action==='Verified'?'Verify Achievement':'Return Goal'}</button></div></form>`,'')}
function cwConfirmVerification(id,cycle,action,form){const g=data.goals.find(g=>String(g.id)===String(id)),c=urCycle(cycle);if(!cwCanManageVerification(g,c)||!['Verified','Returned'].includes(action))return;const reason=String(new FormData(form).get('reason')||'').trim();if(action==='Returned'&&!reason||action==='Verified'&&(cwGoalActual(g,c)==null||!Number.isFinite(Number(cwGoalActual(g,c))))){$('#cwVerifyError').textContent=action==='Returned'?'Enter a reason for revision.':'The employee must record an actual result before verification.';return}cwVerificationEvent(g,c,action,reason);urAudit('Goal '+action.toLowerCase()+': '+g.id+' / '+c.id);closeModal();render();toast(action==='Verified'?'Goal achievement verified':'Goal returned with a reason')}
function cwGoalRows(c,id){return cwLinks(c,id).map(link=>{const g=cwGoal(link),valid=cwAssigned(g,id);return {...urClone(link),name:valid?g.name:'Goal unavailable or reassigned',progress:valid?g.progress:0,due:valid?g.due:'',actual:valid?cwGoalActual(g,c):null,verification:valid?cwVerification(g,c):'Configuration changed',reason:valid?g.goalVerifications?.[c.id]?.reason||'':''}})}
function cwGoalsScore(c,id){if(!c.components.goals||c.scoring.goals!=='manager-verified')return null;const rows=cwGoalRows(c,id);if(!rows.length||rows.some(r=>r.verification!=='Verified'||r.actual==null))return null;const weights=rows.reduce((sum,r)=>sum+r.weight,0);return rows.reduce((sum,r)=>sum+pdIndicatorScore(r,r.actual)*r.weight,0)/weights}
function cwGoalsPanel(c,id,readOnly=false,rows=cwGoalRows(c,id)){return `<section class="panel cw-goal-results"><div class="panelhead"><div><h2>Goals Performance</h2><p>Actual goals linked from the Goals module · ${esc(c.goalTemplateSnapshots?.[id]?.name||cwGoalTemplate(c,id)?.name||'')}</p></div></div><div class="tablewrap"><table><thead><tr><th>ASSIGNED GOAL</th><th>TARGET</th><th>PROGRESS</th><th>RECORDED ACTUAL</th><th>VERIFICATION</th><th>REVIEW</th></tr></thead><tbody>${rows.map(r=>{const g=cwGoal(r);return `<tr><td><b>${esc(r.name)}</b><small>${r.due?date(r.due):''}</small></td><td>${r.direction==='Lower'?'Maximum ':''}${r.target} ${esc(r.unit)}</td><td>${progress(r.progress)}</td><td>${r.actual??'Not recorded'}</td><td>${urBadge(r.verification)}${r.reason?`<small>${esc(r.reason)}</small>`:''}</td><td>${!readOnly&&g&&pmsGoalInScope(g)?`<button class="textbtn" onclick="pmsViewGoal(${JSON.stringify(r.goalId)})">View Goal</button>`:''}${!readOnly&&g&&cwCanRecord(g,c)?`<button class="textbtn" onclick="cwRecordActual('${g.id}','${c.id}')">${Number(g.progress)===100?'Submit for Verification':'Record Actual'}</button>`:''}${!readOnly&&g&&cwCanManageVerification(g,c)?`<button class="textbtn" onclick="cwVerifyGoal('${g.id}','${c.id}','Verified')">Verify Achievement</button><button class="textbtn" onclick="cwVerifyGoal('${g.id}','${c.id}','Returned')">Return for Revision</button>`:''}${readOnly?`${urRating(r.verification==='Verified'?pdIndicatorScore(r,r.actual):null)}`:''}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No linked assigned goals.</td></tr>'}</tbody></table></div><p class="pd-score-note">Progress and milestone updates do not require approval. A 100% goal is complete in progress only; verified actuals determine evaluation scoring.</p></section>`}
pmsViewGoal=function(id){cwBase.viewGoal(id);const g=data.goals.find(g=>String(g.id)===String(id));if(!g||!pmsGoalInScope(g))return;const cycles=UR.cycles.filter(c=>(cwV2(c)||c.demoGoalMigration)&&c.components.goals&&cwLinks(c,pmsGoalOwner(g)).some(l=>String(l.goalId)===String(g.id))&&(urHr()||viewRole==='Manager'&&urTeam(pmsGoalOwner(g))||pmsGoalOwner(g)===urUser()));const body=$('#modal .modalbody');if(body&&cycles.length)body.insertAdjacentHTML('beforeend',`<section class="cw-goal-verification"><h3>Evaluation Goal Verification</h3>${cycles.map(c=>`<p><b>${esc(c.name)}</b><br>${esc(cwVerification(g,c))}${g.goalVerifications?.[c.id]?.reason?' · '+esc(g.goalVerifications[c.id].reason):''}</p><p class="cw-help">${cwLinks(c,pmsGoalOwner(g)).filter(l=>String(l.goalId)===String(g.id)).map(l=>'Target: '+l.target+' '+esc(l.unit)+' · Actual result: '+(cwGoalActual(g,c)??'Not recorded')).join('')}</p>${cwCanRecord(g,c)?`<button onclick="cwRecordActual('${g.id}','${c.id}')">${Number(g.progress)===100?'Submit for Verification':'Record Actual Result'}</button>`:''}`).join('')}</section>`)};
function cwManagerBlock(a){const c=urCycle(a.cycle);return cwV2(c)&&c.components.goals&&a.type==='Manager'?cwGoalRows(c,a.subject).filter(r=>r.verification!=='Verified').map(r=>`${r.name}: resolve Manager verification (${r.verification}).`):[]}
function cwResponseErrors(a){const errors=cwManagerBlock(a);for(const q of a.template.questions){const raw=urAnswers[q.id];if(q.required&&!String(raw??'').trim())errors.push('Answer '+q.title+'.');if(raw&&q.type==='Rating'&&!((raw==='NO'&&q.notObserved)||[1,2,3,4,5].includes(Number(raw))))errors.push('Choose a valid rating for '+q.title+'.');if(raw&&q.type==='Choice'&&!q.options.includes(raw))errors.push('Choose a valid option for '+q.title+'.')}return errors}
urReviewDetail=function(){const a=UR.assignments.find(x=>x.id===urDetail),c=a&&urCycle(a.cycle);if(!cwV2(c))return cwBase.detail();if(!urVisible(a)||!urCanRead(a))return urEmpty('Review unavailable','This assignment is outside your scope.');const editable=urCanEdit(a),stage=c.stages.find(s=>s.id===a.stage);return pdBack("urGoTab('Reviews')",'Back to Reviews')+pdHead('Assessment Details',urPerson(a.subject).name+' · '+stage.name,c.released&&urCanResult(c,a.subject)?`<button class="primary" onclick="urOpenResult('${c.id}','${a.subject}')">View Employee Evaluation Results</button>`:'')+`<section class="panel pd-form">${pdStageTimeline(c,a.subject)}</section>${!pdUnlocked(a)?cwNotice('Locked — Awaiting Previous Assessment. No future-stage responses are editable.'):cwNotice(`${editable?'Complete your assigned stage.':'This submitted assessment is read-only.'} Due ${date(a.deadline)} · ${urEffective(a)}`)+(c.components.goals?cwGoalsPanel(c,a.subject):'')+(c.components.behavioral?`<section class="panel pd-form"><h2>Behavioral Performance</h2><p>${esc(a.template.name)} · v${a.template.version}</p>${urQuestionFields(a.template,urAnswers,!editable)}</section>`:'')+`<section class="panel pd-form"><label>Written Feedback<textarea rows="4" ${editable?'':'readonly'} oninput="pdFeedback=this.value;urDirty=true">${esc(editable?pdFeedback:a.feedback||'')}</textarea></label></section>${editable?`<div class="urerror" id="urValidation" role="alert"></div><div class="pd-form-footer"><button onclick="urSaveResponse()">Save Draft</button><button class="primary" onclick="urConfirmSubmit()">Submit Assessment</button></div>`:''}`}`};

UR.pipPlans??=[];
function pipCompany(){return data.pmsActiveCompanyId||'mayon'}
function pipCopy(value){return JSON.parse(JSON.stringify(value))}
function pipText(value){return typeof value==='string'?value.trim():''}
function pipNumber(value){return (typeof value==='number'||typeof value==='string'&&value.trim()!=='')&&Number.isFinite(Number(value))&&Number(value)>=0}
function pipDate(value){return typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value)&&!Number.isNaN(Date.parse(value))&&new Date(value+'T12:00:00Z').toISOString().slice(0,10)===value}
function pipId(){return 'PIP-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9)}
function pipStaff(employee){return (urHr()||viewRole==='Manager')&&employee!==urUser()&&pdCanJournal(employee)}
function pipEmployeeAllowed(employee){const e=data.employees.find(e=>e[0]===employee);return !!e&&pmsGoalEmployeeInCompany(e)&&(viewRole==='Employee'?employee===urUser():pipStaff(employee))}
function pipCanView(plan){return !!plan&&plan.companyId===pipCompany()&&pipEmployeeAllowed(plan.employee)}
function pipCanManage(plan){return pipCanView(plan)&&pipStaff(plan.employee)}
function pipGet(id){return UR.pipPlans.find(p=>p.id===id&&pipCanView(p))||null}
function pipVisible(){return UR.pipPlans.filter(pipCanView).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))}
function pipIsClosed(plan){return !!plan&&['Completed','Completed with Exclusions','Not Met','Cancelled'].includes(plan.state)}

const pmsWorkflowState = {process:'reviews',index:0,timer:null,opener:null};
function pmsWorkflowCurrent(){return pmsWorkflowProcesses.find(p=>p.id===pmsWorkflowState.process)||pmsWorkflowProcesses[0]}
function pmsWorkflowStop(){if(pmsWorkflowState.timer!==null)clearInterval(pmsWorkflowState.timer);pmsWorkflowState.timer=null}
function pmsWorkflowOpen(){
 pmsCloseHeaderMenus();
 let dialog=document.getElementById('pmsWorkflowDialog');
 if(!dialog){
  dialog=document.createElement('dialog');dialog.id='pmsWorkflowDialog';dialog.className='pms-workflow-dialog';dialog.setAttribute('aria-labelledby','pmsWorkflowTitle');document.body.appendChild(dialog);
  dialog.addEventListener('close',()=>{pmsWorkflowStop();document.getElementById('pmsWorkflowButton')?.setAttribute('aria-expanded','false');pmsWorkflowState.opener?.focus()});
  dialog.addEventListener('cancel',pmsWorkflowStop);
 }
 if(dialog.open)return;
 pmsWorkflowState.opener=document.activeElement;pmsWorkflowStop();pmsWorkflowState.index=0;
 pmsWorkflowRender();dialog.showModal();document.getElementById('pmsWorkflowButton')?.setAttribute('aria-expanded','true');dialog.querySelector('.wf-close').focus();
}
function pmsWorkflowClose(){document.getElementById('pmsWorkflowDialog')?.close()}
function pmsWorkflowSelect(id){if(!pmsWorkflowProcesses.some(p=>p.id===id))return;pmsWorkflowStop();pmsWorkflowState.process=id;pmsWorkflowState.index=0;pmsWorkflowRender();document.querySelector(`.wf-process[data-process="${id}"]`)?.focus()}
function pmsWorkflowChoose(id){const i=pmsWorkflowCurrent().tour.indexOf(id);if(i<0)return;pmsWorkflowStop();pmsWorkflowState.index=i;pmsWorkflowUpdate();document.querySelector(`.wf-node[data-node="${id}"]`)?.focus()}
function pmsWorkflowMove(delta){pmsWorkflowStop();pmsWorkflowState.index=Math.max(0,Math.min(pmsWorkflowCurrent().tour.length-1,pmsWorkflowState.index+delta));pmsWorkflowUpdate(true)}
function pmsWorkflowPlay(){
 if(pmsWorkflowState.timer!==null){pmsWorkflowStop();pmsWorkflowUpdate();return}
 if(pmsWorkflowState.index===pmsWorkflowCurrent().tour.length-1)pmsWorkflowState.index=0;
 pmsWorkflowState.timer=setInterval(()=>{if(!document.getElementById('pmsWorkflowDialog')?.open){pmsWorkflowStop();return}pmsWorkflowState.index++;if(pmsWorkflowState.index>=pmsWorkflowCurrent().tour.length-1)pmsWorkflowStop();pmsWorkflowUpdate(true)},3600);
 pmsWorkflowUpdate(true);
}
function pmsWorkflowIcon(n){
 const role=n[2],kind=n[6]==='decision'?'decision':n[6]==='branch'?'return':/System/.test(role)?'system':/Manager/.test(role)?'manager':/Employee|evaluator/i.test(role)?'employee':'hr';
 const artwork={
  hr:'<rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 5V3h6v2M8 11h8M8 15h4"/><path class="wf-icon-action" d="m13 17 2 2 4-5"/>',
  employee:'<circle cx="10" cy="7" r="3"/><path d="M4 20v-3a6 6 0 0 1 9-5"/><path class="wf-icon-action" d="m14 16 5-5 2 2-5 5-3 1Z"/>',
  manager:'<circle cx="8" cy="7" r="3"/><path d="M2 21v-3a6 6 0 0 1 10-4M16 4a3 3 0 0 1 0 6"/><path class="wf-icon-action" d="m14 17 2 2 5-6"/>',
  system:'<g class="wf-icon-gear"><path d="m9 3 1-2h4l1 2 2 1 2-.3 2 3-1 2v2l1 2-2 3-2-.3-2 1-1 2h-4l-1-2-2-1-2 .3-2-3 1-2V9L3 7l2-3 2 .3Z"/><circle cx="12" cy="10" r="3"/></g><path d="m8 22 3 2 5-4" transform="translate(0 -1)"/>',
  decision:'<path d="M12 21v-7M12 14 5 7M12 14l7-7"/><path class="wf-icon-action" d="M5 12V7h5M14 7h5v5"/>',
  return:'<path d="M8 8h7a6 6 0 0 1 0 12h-3"/><path class="wf-icon-action" d="M8 3 3 8l5 5M3 8h5"/>'
 };
 return `<span class="wf-step-icon wf-icon-${kind}" aria-hidden="true"><svg viewBox="0 0 28 28"><circle class="wf-icon-progress" cx="14" cy="14" r="12" pathLength="100"/><g class="wf-icon-art" transform="translate(3 3) scale(.92)">${artwork[kind]}</g></svg></span>`;
}
function pmsWorkflowGraph(p){
 const height=Math.max(...p.nodes.map(n=>n[3]))*128+138,byId=new Map(p.nodes.map(n=>[n[0],n]));
 const point=n=>({x:n[6]==='branch'?342:30,y:n[3]*128+24});
 const paths=p.edges.map(([from,to,label=''])=>{
  const a=point(byId.get(from)),b=point(byId.get(to));let d,lx,ly;
  if(a.x===b.x){d=`M ${a.x+120} ${a.y+80} L ${b.x+120} ${b.y}`;lx=a.x+144;ly=a.y+103}
  else if(a.x<b.x){d=`M ${a.x+240} ${a.y+40} L ${b.x} ${b.y+40}`;lx=(a.x+240+b.x)/2;ly=a.y+26}
  else{const right=608;d=`M ${a.x+240} ${a.y+40} H ${right} V ${b.y-12} H ${b.x+120} V ${b.y}`;lx=right-8;ly=a.y+98}
  return `<g class="wf-edge" data-from="${from}" data-to="${to}"><path d="${d}" marker-end="url(#wf-arrow)"/><circle class="wf-edge-token" r="3.5" style="offset-path:path('${d}')"/>${label?`<text x="${lx}" y="${ly}" text-anchor="${a.x>b.x?'end':'middle'}">${esc(label)}</text>`:''}</g>`;
 }).join('');
 return `<div class="wf-canvas" style="height:${height}px"><svg class="wf-connectors" viewBox="0 0 630 ${height}" width="630" height="${height}" aria-hidden="true"><defs><marker id="wf-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs>${paths}</svg>${p.nodes.map(n=>{const pos=point(n);return `<button type="button" class="wf-node ${n[6]==='decision'?'wf-decision':''} ${n[6]==='branch'?'wf-branch':''}" style="left:${pos.x}px;top:${pos.y}px" data-node="${n[0]}" aria-controls="wf-step-detail" onclick="pmsWorkflowChoose('${n[0]}')">${pmsWorkflowIcon(n)}<span class="wf-node-copy"><span class="wf-node-role">${esc(n[2])}</span><strong>${esc(n[1])}</strong></span></button>`}).join('')}</div>`;
}
function pmsWorkflowRender(){
 const p=pmsWorkflowCurrent();
 document.getElementById('pmsWorkflowDialog').innerHTML=`<div class="wf-heading"><div><h2 id="pmsWorkflowTitle">Workflow guide</h2><p>Explore the processes, responsibilities and decision points.</p></div><button type="button" class="wf-close pms-icon-button" aria-label="Close workflow guide" onclick="pmsWorkflowClose()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="wf-layout"><nav class="wf-process-list" aria-label="System processes">${pmsWorkflowProcesses.map(x=>`<button type="button" class="wf-process ${x.id===p.id?'wf-selected':''}" data-process="${x.id}" aria-pressed="${x.id===p.id}" onclick="pmsWorkflowSelect('${x.id}')">${esc(x.title)}</button>`).join('')}</nav><section class="wf-main" aria-labelledby="wf-process-title"><div class="wf-process-heading"><h3 id="wf-process-title">${esc(p.title)}</h3><p>${esc(p.summary)}</p><div class="wf-legend"><span><i class="wf-legend-main"></i>Main path</span><span><i class="wf-legend-branch"></i>Exception / correction</span></div></div><div class="wf-chart" role="region" aria-label="${esc(p.title)} flowchart. Select a step to read its details." tabindex="0">${pmsWorkflowGraph(p)}</div><div class="wf-controls"><button type="button" id="wf-previous" aria-label="Previous step" onclick="pmsWorkflowMove(-1)">Previous</button><button type="button" id="wf-play" class="primary" onclick="pmsWorkflowPlay()">Play walkthrough</button><button type="button" id="wf-next" aria-label="Next step" onclick="pmsWorkflowMove(1)">Next</button><span id="wf-position"></span></div></section><section class="wf-detail" id="wf-step-detail" aria-label="Selected step details"><div id="wf-step-content" aria-live="polite" aria-atomic="true"></div><p class="wf-reference-note">This guide explains the workflow. Exploring it does not change your current work or any employee records.</p></section></div>`;
 pmsWorkflowUpdate();
}
function pmsWorkflowUpdate(scroll=false){
 const p=pmsWorkflowCurrent(),id=p.tour[pmsWorkflowState.index],n=p.nodes.find(x=>x[0]===id),running=pmsWorkflowState.timer!==null,visited=new Set(p.tour.slice(0,pmsWorkflowState.index));
 document.querySelectorAll('#pmsWorkflowDialog .wf-node').forEach(el=>{const active=el.dataset.node===id;el.classList.toggle('wf-active',active);el.classList.toggle('wf-visited',visited.has(el.dataset.node));el.setAttribute('aria-pressed',String(active))});
 const previous=p.tour[pmsWorkflowState.index-1];
 document.querySelectorAll('#pmsWorkflowDialog .wf-edge').forEach(el=>el.classList.toggle('wf-edge-active',el.dataset.to===id&&el.dataset.from===previous));
 document.getElementById('wf-step-content').innerHTML=`<div class="wf-detail-identity">${pmsWorkflowIcon(n)}<span class="wf-role">${esc(n[2])}</span></div><h3>${esc(n[1])}</h3><p>${esc(n[4])}</p><h4>Rules & conditions</h4><p>${esc(n[5])}</p>`;
 document.getElementById('wf-play').textContent=running?'Pause walkthrough':pmsWorkflowState.index===p.tour.length-1?'Replay walkthrough':'Play walkthrough';
 document.getElementById('wf-play').setAttribute('aria-pressed',String(running));
 document.getElementById('wf-previous').disabled=pmsWorkflowState.index===0;document.getElementById('wf-next').disabled=pmsWorkflowState.index===p.tour.length-1;
 document.getElementById('wf-position').textContent=`${pmsWorkflowState.index+1} of ${p.tour.length}`;
 document.getElementById('pmsWorkflowDialog').classList.toggle('wf-playing',running);
 if(scroll){const chart=document.querySelector('#pmsWorkflowDialog .wf-chart'),active=document.querySelector('#pmsWorkflowDialog .wf-active');chart.scrollTo({top:Math.max(0,active.offsetTop-chart.clientHeight/2+40),left:Math.max(0,active.offsetLeft-chart.clientWidth/2+120),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&pmsWorkflowState.timer!==null){pmsWorkflowStop();if(document.getElementById('pmsWorkflowDialog')?.open)pmsWorkflowUpdate()}});
</script></body></html>
