function render(){ $('#nav').innerHTML=navs.map(([n,i])=>`<button class="${page===n?'active':''}" onclick="navigate('${n}')"><span class="ico">${i}</span>${n}${n==='Performance reviews'?`<span class="count">${data.employees.filter(e=>e[6]!=='Completed').length}</span>`:''}</button>`).join('');let c='';if(page==='Overview'){c=head('Performance overview','A little clarity. A lot of potential. Here’s how your team is doing.',`<button class="gradient" onclick="openGoal()">＋ Create goal</button>`)+cyclebar()+statcards()+employeeTable(false,true)+`<div class="bottomgrid"><section class="panel"><div class="panelhead"><div><h2>Needs your attention</h2><p>Keep the review cycle moving.</p></div><span class="pill blue">${data.employees.filter(e=>e[6]==='Manager review').length} pending</span></div>${data.employees.filter(e=>e[6]==='Manager review').map(e=>`<div class="taskrow"><span class="datebox">▤</span><div><h3>${esc(e[1])}'s manager review</h3><p>Self-assessment submitted · Due ${date(data.cycle.due)}</p></div><button class="textbtn" onclick="openReview('${e[0]}')">Review →</button></div>`).join('')||'<div class="empty">All manager reviews are up to date.</div>'}</section><section class="panel"><div class="panelhead"><div><h2>The review journey</h2><p>One shared process, from goals to growth.</p></div></div><div class="timeline">${[['01','Set goals','Agree on measurable outcomes'],['02','Self-assessment','Reflect on achievements and challenges'],['03','Manager review','Rate performance and share feedback'],['04','Complete','Acknowledge and plan next steps']].map(x=>`<div class="step"><span class="dot"></span><div><h3>${x[1]}</h3><small>${x[2]}</small></div><span class="pill">${x[0]}</span></div>`).join('')}</div></section></div>`}else if(page==='Employees')c=head('Employees','The people behind every milestone.',`<button class="gradient" onclick="openEmployee()">＋ Add employee</button>`)+employeeTable();else if(page==='Performance reviews')c=head('Performance reviews','Make feedback useful. Make progress visible.')+cyclebar()+employeeTable(true);else if(page==='Goals & KPIs')c=head('Goals & KPIs','Align individual effort with measurable outcomes.',`<button class="gradient" onclick="openGoal()">＋ Create goal</button>`)+`<section class="panel"><div class="panelhead"><div><h2>Team goals</h2><p>Track targets, ownership, and progress.</p></div><span class="pill blue">${data.goals.length} goals</span></div><div class="tablewrap"><table><thead><tr><th>GOAL / KEY RESULT</th><th>OWNER</th><th>CATEGORY</th><th>PROGRESS</th><th>DUE DATE</th><th></th></tr></thead><tbody>${data.goals.map(g=>`<tr><td>${esc(g.name)}</td><td>${esc(g.employee)}</td><td><span class="pill">${esc(g.category)}</span></td><td>${progress(g.progress)}</td><td>${date(g.due)}</td><td><button class="textbtn" onclick="openGoal(${g.id})">Update ↗</button></td></tr>`).join('')}</tbody></table></div></section>`;else if(page==='Review cycles')c=head('Review cycles','Give every review a clear timeline and consistent criteria.',`<button class="gradient" onclick="editCycle()">Edit cycle</button>`)+cyclebar()+`<section class="panel"><div class="panelhead"><div><h2>Cycle configuration</h2><p>A simple, consistent review process for every employee.</p></div>${badge(data.cycle.status)}</div><div class="modalbody"><div class="formgrid"><div><small>PARTICIPANTS</small><h2 style="margin-top:12px">${data.employees.length} employees · All departments</h2></div><div><small>DEADLINE</small><h2 style="margin-top:12px">${date(data.cycle.due)}</h2></div></div><div class="notice">Rating scale: 1 — Needs improvement · 2 — Developing · 3 — Meets expectations · 4 — Exceeds expectations · 5 — Outstanding</div><h2>Evaluation criteria</h2><p>Goal achievement, quality of work, and collaboration carry equal weight. The overall rating is their arithmetic mean. Goal progress is tracked separately.</p><br><h2>Workflow</h2><p>Not started → Self-assessment → Manager review → Completed</p><br><p>Employee acknowledgment is recorded after the manager submits the review.</p></div></section>`;else c=head('Reports','Understand completion and progress at a glance.',`<button onclick="exportCSV()">↓ Export CSV</button>`)+statcards()+`<div class="bottomgrid"><section class="panel"><div class="panelhead"><div><h2>Goal progress by department</h2><p>Average progress across employee goals.</p></div></div><div class="bars">${[...new Set(data.employees.map(e=>e[3]))].map(d=>{let es=data.employees.filter(e=>e[3]===d),n=Math.round(es.reduce((a,e)=>a+employeeProgress(e[1]),0)/es.length);return `<div class="barrow"><span>${esc(d)}</span><div class="track"><i style="width:${n}%"></i></div><span>${n}%</span></div>`}).join('')}</div></section><section class="panel"><div class="panelhead"><div><h2>Review completion</h2><p>Current cycle status breakdown.</p></div></div><div class="bars">${['Not started','Self-assessment','Manager review','Completed'].map(s=>{let n=data.employees.filter(e=>e[6]===s).length;return `<div class="barrow"><span>${s}</span><div class="track"><i style="width:${n/data.employees.length*100}%"></i></div><span>${n}</span></div>`}).join('')}</div></section></div>`;$('#content').innerHTML=c;if($('#search')){$('#search').oninput=e=>{let pos=e.target.selectionStart;query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};$('#dept').onchange=e=>{department=e.target.value;render()};$('#status').onchange=e=>{status=e.target.value;render()}}}
function modal(title,sub,body,buttons){$('#modal').innerHTML=`<div class="modalhead"><div><h2>${title}</h2><p style="font-size:11px">${sub}</p></div><button aria-label="Close dialog" onclick="closeModal()">×</button></div>${body}${buttons?`<div class="modalfoot">${buttons}</div>`:''}`;$('#modal').showModal()}function closeModal(){$('#modal').close()}
function openEmployee(id){let e=data.employees.find(e=>e[0]===id);modal(e?'Employee profile':'Add employee','Employee details and reporting line',`<form id="employeeForm"><div class="modalbody"><div class="formgrid">${[['name','Full name',e?.[1]],['role','Job title',e?.[2]],['department','Department',e?.[3]],['manager','Manager',e?.[4]]].map(([n,l,v])=>`<label>${l}<input name="${n}" required maxlength="70" value="${esc(v||'')}"></label>`).join('')}</div></div><div class="modalfoot"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Save employee</button></div></form>`);$('#employeeForm').onsubmit=ev=>{ev.preventDefault();let f=new FormData(ev.target),vals=['name','role','department','manager'].map(k=>f.get(k).trim());if(vals.some(v=>!v))return;if(e){let old=e[1];e.splice(1,4,...vals);data.goals.forEach(g=>{if(g.employee===old)g.employee=vals[0]})}else data.employees.push(['EMP-'+String(Math.max(...data.employees.map(e=>+e[0].split('-')[1]))+1).padStart(3,'0'),...vals,0,'Not started']);save();closeModal();render();toast('Employee saved')};}
function openGoal(id){let g=data.goals.find(g=>g.id===id);modal(g?'Update goal':'Create goal','Define a measurable outcome and keep progress current.',`<form id="goalForm"><div class="modalbody"><div class="formgrid"><label class="full">Goal / measurable target<input name="name" required maxlength="140" placeholder="e.g. Reduce support response time to 4 hours" value="${esc(g?.name||'')}"></label><label>Owner<select name="employee">${data.employees.map(e=>`<option ${g?.employee===e[1]?'selected':''}>${esc(e[1])}</option>`).join('')}</select></label><label>Category<select name="category">${['Quality','Delivery','Growth','Collaboration'].map(c=>`<option ${g?.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Due date<input name="due" type="date" required value="${g?.due||data.cycle.due}"></label><label>Progress (%)<input name="progress" type="number" required min="0" max="100" value="${g?.progress||0}"></label></div></div><div class="modalfoot"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Save goal</button></div></form>`);$('#goalForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),v={id:g?.id||Date.now(),name:f.get('name').trim(),employee:f.get('employee'),category:f.get('category'),due:f.get('due'),progress:+f.get('progress')};if(!v.name)return;g?Object.assign(g,v):data.goals.push(v);save();closeModal();render();toast('Goal saved')};}
function openReview(id){let e=data.employees.find(x=>x[0]===id),r=data.reviews[id]||{},complete=e[6]==='Completed',self=e[6]==='Not started'||e[6]==='Self-assessment';modal(`${esc(e[1])} · Performance review`,`${esc(data.cycle.name)} · ${esc(e[3])}`,`<form id="reviewForm"><div class="modalbody"><div style="display:flex;justify-content:space-between">${person(e)}${badge(e[6])}</div><div class="notice">Demo role: ${self?'Employee self-assessment':'Manager evaluation'}. Use this screen to walk through the review workflow.</div><h2>Goals & achievements</h2>${data.goals.filter(g=>g.employee===e[1]).map(g=>`<div class="reviewgoal"><p>${esc(g.name)}</p>${progress(g.progress)}</div>`).join('')||'<p>No goals assigned yet.</p>'}<label style="margin-top:18px">Employee reflection<textarea name="reflection" rows="3" ${!self?'readonly':''} ${self?'required':''} placeholder="What went well? What could improve?">${esc(r.reflection||(!self?'Delivered key milestones and identified opportunities to improve collaboration.':''))}</textarea></label>${!self?`<div class="formgrid">${['Goal achievement','Quality of work','Collaboration'].map((l,i)=>`<label>${l}<select name="score${i}" ${complete?'disabled':''}>${[1,2,3,4,5].map(n=>`<option value="${n}" ${(r.scores?.[i]||3)===n?'selected':''}>${n} — ${['Needs improvement','Developing','Meets expectations','Exceeds expectations','Outstanding'][n-1]}</option>`).join('')}</select></label>`).join('')}<label class="full">Manager feedback & development actions<textarea name="feedback" rows="3" ${complete?'readonly':'required'} placeholder="Give specific feedback and agree on the next growth step.">${esc(r.feedback||(complete?'Consistent delivery and positive collaboration. Continue developing ownership of larger initiatives.':''))}</textarea></label></div>${complete?`<div class="notice">Overall rating: <b>${r.scores?(r.scores.reduce((a,b)=>a+b,0)/3).toFixed(1):'3.0'} / 5</b> · ${r.acknowledged?'Acknowledged by employee':'Awaiting employee acknowledgment'}</div>`:''}`:''}</div><div class="modalfoot"><button type="button" onclick="closeModal()">Close</button>${complete?`<button type="button" class="primary" onclick="acknowledge('${id}')" ${r.acknowledged?'disabled':''}>${r.acknowledged?'Acknowledged':'Acknowledge as employee'}</button>`:`<button type="button" onclick="saveReviewDraft('${id}',${self})">Save draft</button><button class="primary">${self?'Submit self-assessment':'Complete manager review'}</button>`}</div></form>`);$('#reviewForm').onsubmit=ev=>{ev.preventDefault();let f=new FormData(ev.target);data.reviews[id]={...r,reflection:f.get('reflection'),...(self?{}:{scores:[0,1,2].map(i=>+f.get('score'+i)),feedback:f.get('feedback')})};e[6]=self?'Manager review':'Completed';save();closeModal();render();toast(self?'Self-assessment submitted to manager':'Manager review completed')};}
function saveReviewDraft(id,self){let f=new FormData($('#reviewForm'));data.reviews[id]={...data.reviews[id],reflection:f.get('reflection'),...(!self?{scores:[0,1,2].map(i=>+f.get('score'+i)),feedback:f.get('feedback')}:{})};if(self)data.employees.find(e=>e[0]===id)[6]='Self-assessment';save();closeModal();render();toast('Review draft saved')}
function acknowledge(id){data.reviews[id]={...data.reviews[id],acknowledged:true};save();closeModal();render();toast('Employee acknowledgment recorded')}
function editCycle(){modal('Edit review cycle','Applies to the current cycle and all participants.',`<form id="cycleForm"><div class="modalbody"><div class="formgrid"><label class="full">Cycle name<input name="name" required value="${esc(data.cycle.name)}"></label><label>Review deadline<input name="due" type="date" required value="${data.cycle.due}"></label><label>Status<select name="status">${['Active','Closed'].map(s=>`<option ${data.cycle.status===s?'selected':''}>${s}</option>`).join('')}</select></label></div><div class="notice">Closing a cycle labels it closed in this prototype. Production should also enforce deadline and edit restrictions.</div></div><div class="modalfoot"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Save cycle</button></div></form>`);$('#cycleForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.cycle=Object.fromEntries(f);save();closeModal();render();toast('Cycle updated')};}
function exportCSV(){let rows=[['Employee ID','Name','Role','Department','Manager','Goal progress (%)','Review status'],...data.employees.map(e=>[...e.slice(0,5),employeeProgress(e[1]),e[6]])];let csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='performance-report.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Performance report exported')}

</script><script>// Role tabs demonstrate product permissions. Production requires server authorization.

const employeeId='EMP-003', managerName='Angela Reyes';

function roleNav(){return viewRole==='Employee'?[['Dashboard','▦'],['My Goals','◎'],['My Reviews','▤'],['My Profile','♧']]:viewRole==='Manager'?[['Dashboard','▦'],['My Team','♧'],['Team Goals','◎'],['Team Reviews','▤'],['Review Cycles','◷'],['Reports','▥']]:[['Dashboard','▦'],['Employees','♧'],['Goals & KPIs','◎'],['Performance Reviews','▤'],['Review Cycles','◷'],['Reports','▥']]}

function metrics(){const es=participants(),gs=scopedGoals(),done=es.filter(e=>e[6]==='Completed').length,avg=gs.length?Math.round(gs.reduce((a,g)=>a+g.progress,0)/gs.length):0;return {es,gs,done,avg}}
function roleStats(){const {es,gs,done,avg}=metrics();return `<div class="stats">${(viewRole==='Employee'?[['My goals',gs.length,'Across all assigned goals'],['Goal progress',avg+'%','Average of my goal progress'],['My review',es[0]?.[6]||'Not assigned','Current cycle status'],['Review deadline',date(currentCycle().due),'Manager review deadline']]:[['Employees in cycle',es.length,viewRole==='Manager'?'Your direct reports':'Included participants'],['Reviews completed',`${done} / ${es.length}`,`${es.length?Math.round(done/es.length*100):0}% complete`],['Awaiting manager',es.filter(e=>e[6]==='Manager review').length,'Self-assessments submitted'],['Goal progress',avg+'%','All goals in your visible scope']]).map(([l,n,h])=>`<div class="stat"><div class="top">${l}<span class="symbol">◈</span></div><strong class="${String(n).length>15?'smallmetric':''}">${esc(n)}</strong><small>${h}</small></div>`).join('')}</div>`}

function charts(){const {es,gs,done}=metrics();const statuses=['Not started','Self-assessment','Manager review','Completed'];let offset=0;const circles=statuses.map((s,i)=>{const pct=es.length?es.filter(e=>e[6]===s).length/es.length*100:0;let svg=`<circle cx="70" cy="70" r="52" fill="none" stroke="${colors[i]}" stroke-width="15" pathLength="100" stroke-dasharray="${pct} ${100-pct}" stroke-dashoffset="${-offset}"/>`;offset+=pct;return svg}).join('');const donut=`<div class="donutwrap"><svg viewBox="0 0 140 140" role="img" aria-label="Review status distribution, ${done} of ${es.length} completed"><circle cx="70" cy="70" r="52" fill="none" stroke="#f0f3f7" stroke-width="15"/><g transform="rotate(-90 70 70)">${circles}</g><text x="70" y="69" text-anchor="middle" font-size="24" fill="#334c61">${es.length?Math.round(done/es.length*100):0}%</text><text x="70" y="86" text-anchor="middle" font-size="9" fill="#8b9eac">COMPLETED</text></svg><div class="legend">${statuses.map((s,i)=>`<div><i style="background:${colors[i]}"></i><span>${s}</span><b>${es.filter(e=>e[6]===s).length}</b></div>`).join('')}</div></div>`;

function urAddQuestion(si){urEditor.questions.push(urQuestion('','Rating',urEditor.sections[si]));urDirty=true;render()}
function urDuplicateQuestion(id){const i=urEditor.questions.findIndex(q=>q.id===id),q=urClone(urEditor.questions[i]);q.id=urUid('q');urEditor.questions.splice(i+1,0,q);urDirty=true;render()}
function urDeleteQuestion(id){urEditor.questions=urEditor.questions.filter(q=>q.id!==id);urDirty=true;render()}
function urMoveQuestion(id,by){const q=urEditor.questions.find(q=>q.id===id),siblings=urEditor.questions.filter(x=>x.section===q.section),i=siblings.indexOf(q),target=siblings[i+by];if(!target)return;const a=urEditor.questions.indexOf(q),b=urEditor.questions.indexOf(target);[urEditor.questions[a],urEditor.questions[b]]=[urEditor.questions[b],urEditor.questions[a]];urDirty=true;render()}
function urAddSection(){let name='Section '+(urEditor.sections.length+1);while(urEditor.sections.includes(name))name+=' (new)';urEditor.sections.push(name);urDirty=true;render()}
function urRenameSection(i,name){name=name.trim();if(!name||urEditor.sections.some((s,j)=>s===name&&j!==i)){toast('Use a unique, non-empty section title');render();return}const old=urEditor.sections[i];urEditor.sections[i]=name;urEditor.questions.forEach(q=>{if(q.section===old)q.section=name});urDirty=true;render()}
function urMoveSection(i,by){if(i+by<0||i+by>=urEditor.sections.length)return;[urEditor.sections[i],urEditor.sections[i+by]]=[urEditor.sections[i+by],urEditor.sections[i]];urDirty=true;render()}
function urSetOption(id,i,value){urEditor.questions.find(q=>q.id===id).options[i]=value;urDirty=true}
function urAddOption(id){urEditor.questions.find(q=>q.id===id).options.push('');urDirty=true;render()}
function urRemoveOption(id,i){urEditor.questions.find(q=>q.id===id).options.splice(i,1);urDirty=true;render()}
function urTemplateErrors(t,publish){const errors=[];if(!t.name.trim())errors.push('Enter a template name.');if(publish){if(!t.questions.length)errors.push('Add at least one question.');if(t.sections.some(s=>!t.questions.some(q=>q.section===s)))errors.push('Add at least one question to every section.');if(t.questions.some(q=>!q.title.trim()))errors.push('Enter a title for each question.');for(const q of t.questions.filter(q=>q.type==='Choice'))if(q.options.length<2||q.options.some(o=>!o.trim())||new Set(q.options.map(o=>o.trim().toLowerCase())).size!==q.options.length)errors.push('Multiple-choice questions need at least two distinct, non-empty options.')}return [...new Set(errors)]}
function urSaveTemplate(state){if(!urHr())return;const errors=urTemplateErrors(urEditor,state==='Published');if(errors.length){if(urPreview){urPreview=false;render()}$('#urBuilderError').textContent=errors.join(' ');return}const t=urClone(urEditor);delete t.isNew;delete t.original;t.status=state;t.name=t.name.trim();t.updated=urToday;const i=UR.templates.findIndex(x=>x.id===t.id);if(i>=0)UR.templates[i]=t;else UR.templates.push(t);urDirty=false;urAudit('Template '+state.toLowerCase()+': '+t.id);urScreen='list';urTab='Templates';urPreview=false;render();toast(state==='Published'?'Template published':'Template draft saved')}
function urCycleList(){const cs=UR.cycles.filter(c=>urHr()||UR.assignments.some(a=>a.cycle===c.id&&urVisible(a))||c.participants.some(id=>id===urUser()||viewRole==='Manager'&&urTeam(id)));return urPageHead('Review Cycles','Plan, launch, and monitor employee performance review cycles.',urHr()?'<button class="gradient" onclick="urStartWizard(null,true)">＋ Create Cycle</button>':'')+urSummaryCards([['Total Cycles',cs.length,'Cycles visible to your role'],['Draft Cycles',cs.filter(c=>c.status==='Draft').length,'Configuration in progress'],['Active Cycles',cs.filter(c=>c.status==='Active').length,'Accepting evaluator responses'],['Completed Cycles',cs.filter(c=>c.status==='Completed').length,'Finalized workflows']])+(urHr()&&UR.draftCycle?'<div class="notice urresumebar">You have a saved setup in progress. <button class="textbtn" onclick="urStartWizard()">Resume cycle setup →</button></div>':'')+`<section class="panel"><div class="panelhead"><div><h2>Cycle register</h2><p>Templates define the questions. Cycles generate individual review assignments.</p></div></div><div class="toolbar urtoolbar"><label class="urfilter ursearch"><span>Search</span><input class="search" aria-label="Search review cycles" placeholder="Search cycle name…" value="${esc(urCycleFilter.q)}" oninput="urCycleFilter.q=this.value;urDrawCycles()"></label>${urSelect('Cycle status','', ['All statuses','Draft','Scheduled','Active','Completed','Cancelled'],urCycleFilter.status,'urCycleFilter.status=this.value;urDrawCycles()')}${urSelect('Cycle review type','',['All types','Standard Performance Review','360° Feedback','Probationary Review','Project-Based Review'],urCycleFilter.type,'urCycleFilter.type=this.value;urDrawCycles()')}${urSelect('Review period','',['All periods',...new Set(cs.map(c=>c.periodStart+' — '+c.periodEnd))],urCycleFilter.period,'urCycleFilter.period=this.value;urDrawCycles()')}</div><div class="tablewrap"><table><thead><tr><th>CYCLE NAME</th><th>REVIEW TYPE</th><th>REVIEW PERIOD</th><th>PARTICIPANTS</th><th>PROGRESS</th><th>DEADLINE</th><th>STATUS</th><th>ACTIONS</th></tr></thead><tbody id="urCycleRows"></tbody></table></div></section>`}
function urCycleAssignments(c){return UR.assignments.filter(a=>a.cycle===c.id)}
function urDrawCycles(){const cs=UR.cycles.filter(c=>urHr()||c.participants.some(id=>id===urUser()||viewRole==='Manager'&&urTeam(id))||UR.assignments.some(a=>a.cycle===c.id&&a.reviewer===urUser())).filter(c=>c.name.toLowerCase().includes(urCycleFilter.q.toLowerCase())&&(urCycleFilter.status==='All statuses'||c.status===urCycleFilter.status)&&(urCycleFilter.type==='All types'||c.type===urCycleFilter.type)&&(urCycleFilter.period==='All periods'||c.periodStart+' — '+c.periodEnd===urCycleFilter.period));$('#urCycleRows').innerHTML=cs.map(c=>{const all=urCycleAssignments(c).filter(urVisible),done=all.filter(a=>a.state==='Completed').length,submitted=all.filter(a=>a.state==='Submitted').length;return `<tr><td class="urwrap"><button class="textbtn" onclick="urOpenCycle('${c.id}')"><b>${esc(c.name)}</b></button>${c.released?'<small>Results released</small>':''}</td><td>${esc(c.type)}</td><td>${date(c.periodStart)}<small>to ${date(c.periodEnd)}</small></td><td>${urHr()?c.participants.length:c.participants.filter(id=>id===urUser()||viewRole==='Manager'&&urTeam(id)).length}</td><td>${done} / ${all.length}<small>${submitted} submitted${urHr()?'':' · visible assignments'}</small>${progress(all.length?Math.round(done/all.length*100):0)}</td><td>${date(c.deadline)}</td><td>${urBadge(c.status)}</td><td><div class="uractions"><button class="textbtn" onclick="urOpenCycle('${c.id}')">View</button>${urHr()&&c.status==='Draft'?`<button class="textbtn" onclick="urStartWizard('${c.id}')">Continue setup</button>`:''}</div></td></tr>`}).join('')||'<tr><td colspan="8">'+urEmpty('No cycles found','Try another filter. HR can create a new cycle from here.')+'</td></tr>'}
function urNewCycle(){return {id:urUid('cycle'),name:'',description:'',type:'Standard Performance Review',periodStart:'2026-07-01',periodEnd:'2026-09-30',start:'2026-10-19',deadline:'2026-11-13',participants:[],groups:['Self','Manager'],evaluators:[],templates:{},anonymousPeer:true,anonymousUpward:true,threshold:3,status:'Draft',released:false,finalComments:{},created:urToday}}

function urStartWizard(id,fresh=false){if(!urHr())return;urGo(()=>{page='Reviews';urWizard=id?urClone(urCycle(id)):!fresh&&UR.draftCycle?urClone(UR.draftCycle):urNewCycle();urStep=urWizard.savedStep||1;urWizard.status='Draft';urScreen='wizard';urTab='Cycles';urDirty=false;urEmployeeSearch='';urEmployeeDept='All departments';render()})}
function urSetCycle(k,v){urWizard[k]=v;urDirty=true}
function urCycleValidation(c,step=5){const e=[];if(!c.name.trim())e.push('Enter a cycle name.');if(!c.periodStart||!c.periodEnd||c.periodStart>c.periodEnd)e.push('Review period start must be on or before its end.');if(!c.start||!c.deadline||c.start>c.deadline)e.push('Cycle start must be on or before the submission deadline.');if(step>=2&&!c.participants.length)e.push('Select at least one employee.');if(step>=3){if(!c.groups.length)e.push('Enable at least one evaluator type.');for(const subject of c.participants)for(const type of c.groups)if(!c.evaluators.some(a=>a.subject===subject&&a.type===type))e.push(`${urPerson(subject).name} needs a ${type} evaluator.`);const keys=c.evaluators.map(a=>a.subject+'|'+a.type+'|'+a.reviewer);if(new Set(keys).size!==keys.length)e.push('Remove duplicate evaluator assignments.');if(c.evaluators.some(a=>!c.participants.includes(a.subject)||!urPeople().some(p=>p.id===a.reviewer)))e.push('Every assignment needs a valid employee and evaluator.');if(c.evaluators.some(a=>a.type==='Self'?a.subject!==a.reviewer:a.subject===a.reviewer))e.push('Self evaluators must be the employee; other evaluator types must be someone else.');if(!Number.isInteger(+c.threshold)||+c.threshold<2||+c.threshold>10)e.push('Anonymous response threshold must be a whole number from 2 to 10.');}if(step>=4){for(const type of c.groups){const t=UR.templates.find(t=>t.id===c.templates[type]);if(!t||t.status!=='Published')e.push('Choose a published template for '+type+'.');else if(urTemplateErrors(t,true).length)e.push('The '+type+' template contains invalid questions.')}}return [...new Set(e)]}
function urWizardStep(step){if(step>urStep){const errors=urCycleValidation(urWizard,urStep);if(errors.length){$('#urWizardError').textContent=errors.join(' ');return}}urStep=step;render()}
function urWizardPage(){if(!urHr()||!urWizard)return '';const c=urWizard;return urPageHead('Create Review Cycle','Configure participants, evaluator perspectives, forms, and timelines.',`<button onclick="urGoTab('Cycles')">← Back to Cycles</button>`)+`<div class="urstepper">${['General Information','Select Employees','Assign Evaluators','Select Templates','Review & Launch'].map((s,i)=>`<button class="${urStep===i+1?'active':urStep>i+1?'done':''}" onclick="urWizardStep(${i+1})"><span>${urStep>i+1?'✓':i+1}</span>${s}</button>`).join('')}</div><section class="panel urwizardpanel"><div class="panelhead"><div><div class="eyebrow">STEP ${urStep} OF 5</div><h2>${['General Information','Select Employees','Assign Evaluators','Select Templates','Review & Launch'][urStep-1]}</h2><p>${['Define the period being evaluated and when responses will be collected.','Choose the people who will receive evaluations.','Assign one or more evaluators for each enabled perspective.','Reuse published forms for each evaluator group.','Confirm the configuration before creating assignments.'][urStep-1]}</p></div></div><div class="urwizardbody">${urStep===1?`<div class="formgrid"><label class="full">Cycle Name <span class="required">*</span><input maxlength="120" required value="${esc(c.name)}" oninput="urSetCycle('name',this.value)"></label><label class="full">Description<textarea rows="3" maxlength="2000" oninput="urSetCycle('description',this.value)">${esc(c.description)}</textarea></label><label class="full">Review Type<select onchange="urSetCycle('type',this.value)">${['Standard Performance Review','360° Feedback','Probationary Review','Project-Based Review'].map(t=>`<option ${c.type===t?'selected':''}>${t}</option>`).join('')}</select></label>${[['Review Period Start Date','periodStart'],['Review Period End Date','periodEnd'],['Cycle Start Date','start'],['Submission Deadline','deadline']].map(([l,k])=>`<label>${l} <span class="required">*</span><input type="date" required value="${c[k]}" onchange="urSetCycle('${k}',this.value)"></label>`).join('')}</div>`:urStep===2?`<div class="toolbar urtoolbar"><label class="urfilter ursearch"><span>Search</span><input class="search" aria-label="Search cycle employees" value="${esc(urEmployeeSearch)}" placeholder="Search name or employee ID…" oninput="urEmployeeSearch=this.value;urDrawEmployeeLookup()"></label>${urSelect('Department','',['All departments',...new Set(data.employees.map(e=>e[3]))],urEmployeeDept,'urEmployeeDept=this.value;urDrawEmployeeLookup()')}<button onclick="urSelectAllEmployees()">Select All Filtered</button><button onclick="urWizard.participants=[];urSyncEvaluators();urDirty=true;render()">Clear selection</button><b id="urSelectedCount"></b></div><div class="tablewrap"><table><thead><tr><th>SELECT</th><th>EMPLOYEE</th><th>EMPLOYEE ID</th><th>DEPARTMENT</th><th>POSITION</th><th>IMMEDIATE SUPERVISOR</th></tr></thead><tbody id="urEmployeeLookup"></tbody></table></div>`:urStep===3?urEvaluatorStep():urStep===4?urTemplateStep():urLaunchSummary(c)}</div><div class="urerror" id="urWizardError" role="alert"></div><div class="urwizardfoot"><span>${c.participants.length} selected employees · ${c.evaluators.length} expected assignments</span><button onclick="urSaveCycleDraft()">Save as Draft</button>${urStep>1?`<button onclick="urWizardStep(${urStep-1})">Back</button>`:''}${urStep<5?`<button class="primary" onclick="urWizardStep(${urStep+1})">Continue →</button>`:`${c.start>urToday?`<button class="primary" onclick="urConfirmCycle('Scheduled')">Schedule Cycle</button>`:urCycleValidation(c).length===0&&c.deadline>=urToday?`<button class="primary" onclick="urConfirmCycle('Active')">Launch Cycle</button>`:'<span class="urmuted">Complete all required configuration to launch.</span>'}`}</div></section>`}
function urFilteredEmployees(){return data.employees.filter(e=>e.join(' ').toLowerCase().includes(urEmployeeSearch.toLowerCase())&&(urEmployeeDept==='All departments'||e[3]===urEmployeeDept))}
function urDrawEmployeeLookup(){$('#urEmployeeLookup').innerHTML=urFilteredEmployees().map(e=>`<tr><td><input type="checkbox" aria-label="Select ${esc(e[1])}" ${urWizard.participants.includes(e[0])?'checked':''} onchange="urToggleEmployee('${e[0]}',this.checked)"></td><td>${urDisplayPerson(e[0])}</td><td>${e[0]}</td><td>${esc(e[3])}</td><td>${esc(e[2])}</td><td>${esc(e[4])}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No matching employees.</td></tr>';$('#urSelectedCount').textContent=urWizard.participants.length+' selected'}
function urToggleEmployee(id,on){urWizard.participants=on?[...new Set([...urWizard.participants,id])]:urWizard.participants.filter(x=>x!==id);urSyncEvaluators();urDirty=true;urDrawEmployeeLookup()}
function urSelectAllEmployees(){urWizard.participants=[...new Set([...urWizard.participants,...urFilteredEmployees().map(e=>e[0])])];urSyncEvaluators();urDirty=true;render()}
function urSyncEvaluators(){const c=urWizard;c.evaluators=c.evaluators.filter(e=>c.participants.includes(e.subject)&&c.groups.includes(e.type));for(const subject of c.participants){if(c.groups.includes('Self')&&!c.evaluators.some(e=>e.subject===subject&&e.type==='Self'))c.evaluators.push({subject,reviewer:subject,type:'Self'});if(c.groups.includes('Manager')&&!c.evaluators.some(e=>e.subject===subject&&e.type==='Manager')){const reviewer=urSupervisor(subject);if(reviewer)c.evaluators.push({subject,reviewer,type:'Manager'})}}}
function urEvaluatorStep(){const c=urWizard;return `<div class="urevaluatorgroups">${urTypes.map(type=>`<label class="urcheck"><input type="checkbox" ${c.groups.includes(type)?'checked':''} onchange="urToggleGroup('${type}',this.checked)">${{Self:'Self-Assessment',Manager:'Manager Evaluation',Peer:'Peer Evaluation',Upward:'Upward / Direct Report Evaluation'}[type]}</label>`).join('')}</div><div class="notice">Immediate supervisors are suggested from employee records. Review the assignment, change a manager, and add multiple peer or upward evaluators. Duplicate evaluator + employee + type combinations are blocked.</div>${c.participants.map(subject=>`<section class="urassigncard"><div>${urDisplayPerson(subject)}<small>Immediate supervisor: ${esc(urPerson(subject).manager)}</small></div><div class="urassigngroups">${c.groups.map(type=>`<div><b>${type}</b><div class="urevaluatorchips">${c.evaluators.filter(e=>e.subject===subject&&e.type===type).map(e=>`<span class="urevaluatorchip">${esc(urPerson(e.reviewer).name)}${type!=='Self'?`<button aria-label="Remove ${esc(urPerson(e.reviewer).name)} ${type} assignment" onclick="urRemoveEvaluator('${subject}','${type}','${e.reviewer}')">×</button>`:''}</span>`).join('')||'<span class="required">No evaluator assigned</span>'}</div>${type!=='Self'?`<select aria-label="Add ${type} evaluator for ${esc(urPerson(subject).name)}" onchange="urAddEvaluator('${subject}','${type}',this.value);this.value=''" ${type==='Manager'&&c.evaluators.some(e=>e.subject===subject&&e.type===type)?'disabled':''}><option value="">${type==='Manager'?'Select manager…':'＋ Add evaluator…'}</option>${urPeople().filter(p=>p.id!==subject).map(p=>`<option value="${p.id}" ${c.evaluators.some(e=>e.subject===subject&&e.type===type&&e.reviewer===p.id)?'disabled':''}>${esc(p.name)} · ${esc(p.position)}</option>`).join('')}</select>`:''}</div>`).join('')}</div></section>`).join('')}<section class="urconfidentiality"><h2>Confidentiality & response threshold</h2><div class="formgrid"><label class="urcheck"><input type="checkbox" ${c.anonymousPeer?'checked':''} onchange="urSetCycle('anonymousPeer',this.checked)">Group peer feedback anonymously</label><label class="urcheck"><input type="checkbox" ${c.anonymousUpward?'checked':''} onchange="urSetCycle('anonymousUpward',this.checked)">Group upward feedback anonymously</label><label>Minimum responses per anonymous group<input type="number" min="2" max="10" step="1" value="${c.threshold}" onchange="urSetCycle('threshold',+this.value)"></label></div><p>Below this threshold, that group’s ratings and written feedback stay hidden—even after results are released. Evaluator identities are never shown in anonymous result groups.</p></section>`}
function urToggleGroup(type,on){urWizard.groups=on?[...new Set([...urWizard.groups,type])]:urWizard.groups.filter(t=>t!==type);urSyncEvaluators();urDirty=true;render()}
function urAddEvaluator(subject,type,reviewer){if(!reviewer)return;if(type==='Manager'&&urWizard.evaluators.some(e=>e.subject===subject&&e.type===type)||urWizard.evaluators.some(e=>e.subject===subject&&e.type===type&&e.reviewer===reviewer)){toast('This evaluator is already assigned');return}if(reviewer===subject){toast('Choose someone other than the employee');return}urWizard.evaluators.push({subject,type,reviewer});urDirty=true;render()}
function urRemoveEvaluator(subject,type,reviewer){urWizard.evaluators=urWizard.evaluators.filter(e=>!(e.subject===subject&&e.type===type&&e.reviewer===reviewer));urDirty=true;render()}
function urTemplateStep(){const c=urWizard,published=UR.templates.filter(t=>t.status==='Published');return `<div class="notice">Only published templates can be assigned. A form can be reused across evaluator groups and cycles. Each launched assignment stores its own template version.</div>${c.groups.map(type=>`<div class="urtemplatemapping"><div><h3>${{Self:'Self-Assessment',Manager:'Manager Evaluation',Peer:'Peer Evaluation',Upward:'Upward Evaluation'}[type]}</h3><small>${c.evaluators.filter(e=>e.type===type).length} evaluator assignments</small></div><select aria-label="${type} review template" onchange="urWizard.templates['${type}']=this.value;urDirty=true;render()"><option value="">Select a published template…</option>${published.map(t=>`<option value="${t.id}" ${c.templates[type]===t.id?'selected':''}>${esc(t.name)} · v${t.version}</option>`).join('')}</select>${c.templates[type]?`<button onclick="urPreviewTemplate('${c.templates[type]}')">Preview</button>`:''}</div>`).join('')}${!published.length?urEmpty('No published templates','Create and publish a form, then resume this setup.'):''}<button onclick="urCreateTemplateFromWizard()">＋ Create Template</button><small>Your current cycle setup will be preserved.</small>`}
function urCreateTemplateFromWizard(){UR.draftCycle={...urClone(urWizard),savedStep:urStep};urDirty=false;urPersist();urEditTemplate()}
function urLaunchSummary(c){const errors=urCycleValidation(c);return `<div class="ursummarygrid">${[['Cycle',c.name],['Review Type',c.type],['Review Period',date(c.periodStart)+' – '+date(c.periodEnd)],['Cycle Start',date(c.start)],['Submission Deadline',date(c.deadline)],['Employees',c.participants.length],['Expected Assignments',c.evaluators.length],['Anonymous Feedback',`Peer: ${c.anonymousPeer?'anonymous':'named'} · Upward: ${c.anonymousUpward?'anonymous':'named'} · Minimum ${c.threshold} responses`]].map(([l,v])=>`<div><small>${l}</small><b>${esc(v)}</b></div>`).join('')}</div><h2>Participants & assignments</h2><div class="tablewrap"><table><thead><tr><th>EMPLOYEE</th><th>EVALUATORS</th></tr></thead><tbody>${c.participants.map(id=>`<tr><td>${urDisplayPerson(id)}</td><td class="urwrap">${c.evaluators.filter(e=>e.subject===id).map(e=>`${e.type}: ${esc(urPerson(e.reviewer).name)}`).join('<br>')}</td></tr>`).join('')}</tbody></table></div><h2 style="margin:24px 0 12px">Selected templates</h2>${c.groups.map(type=>`<div class="urtemplatepair"><span>${type}</span><b>${esc(UR.templates.find(t=>t.id===c.templates[type])?.name||'Not selected')}</b></div>`).join('')}<div class="notice">${c.start>urToday?'Scheduled cycles generate assignments when their start date is reached in the sample workspace.':'Launching generates one review for every evaluator assignment.'} HR finalizes the workflow after all responses are submitted, then explicitly releases results.</div>${errors.length?`<div class="urerror">${errors.map(esc).join('<br>')}</div>`:''}`}
function urSaveCycleDraft(){if(!urHr())return;const c=urClone(urWizard);c.name=c.name.trim()||'Untitled review cycle';c.savedStep=urStep;c.status='Draft';const i=UR.cycles.findIndex(x=>x.id===c.id);if(i>=0)UR.cycles[i]=c;else UR.cycles.push(c);UR.draftCycle=c;urDirty=false;urAudit('Cycle draft saved: '+c.id);toast('Cycle draft saved');render()}
function urConfirmCycle(state){if(!urHr())return;const errors=urCycleValidation(urWizard);if(state==='Scheduled'&&urWizard.start<=urToday)errors.push('Use a future start date to schedule a cycle.');if(state==='Active'&&(urWizard.start>urToday||urWizard.deadline<urToday))errors.push('Immediate launch requires a current start date and a deadline that has not passed.');if(errors.length){$('#urWizardError').textContent=errors.join(' ');return}modal(state==='Active'?'Launch this review cycle?':'Schedule this review cycle?',state==='Active'?'Individual review assignments will be created now.':'Assignments will open on the scheduled start date.',`<div class="modalbody"><p>${esc(urWizard.name)} includes ${urWizard.participants.length} employees and ${urWizard.evaluators.length} evaluator assignments.</p></div>`,`<button onclick="closeModal()">Back to setup</button><button class="primary" onclick="urCommitCycle('${state}')">${state==='Active'?'Confirm Launch':'Confirm Schedule'}</button>`)}
function urGenerateAssignments(c){if(UR.assignments.some(a=>a.cycle===c.id))return;for(const e of c.evaluators){const t=(c.templateSnapshots||{})[e.type]||UR.templates.find(t=>t.id===c.templates[e.type]);UR.assignments.push({id:urUid('rev'),cycle:c.id,...urClone(e),deadline:c.deadline,template:urClone(t),state:'Not Started',answers:{},updated:urToday})}}

openGoal=function(id){const goal=data.goals.find(g=>g.id===id),owners=[...data.employees];modal(goal?'Update goal':'Create goal','Define a measurable outcome, milestones, and progress.',`<form id="pmsGoalForm"><div class="modalbody"><div class="formgrid"><label class="full">Goal / measurable target<input name="name" required maxlength="140" value="${esc(goal?.name||'')}" placeholder="e.g. Reduce support response time to four hours"></label><label>Owner<select name="employee">${owners.map(e=>`<option ${goal?.employee===e[1]?'selected':''}>${esc(e[1])}</option>`).join('')}</select></label><label>Category<select name="category">${['Quality','Delivery','Growth','Collaboration'].map(c=>`<option ${goal?.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Due date<input name="due" type="date" required value="${goal?.due||data.cycle.due}"></label><label>Progress (%)<input name="progress" type="number" required min="0" max="100" value="${goal?.progress??0}"></label><label class="full">Milestones (one per line)<textarea name="milestones" rows="4" placeholder="Draft approach&#10;Review with manager&#10;Deliver final result">${esc((goal?.milestones||[]).join('\n'))}</textarea></label></div></div><div class="modalfoot"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Save goal</button></div></form>`);$('#pmsGoalForm').onsubmit=event=>{event.preventDefault();const f=new FormData(event.target),name=String(f.get('name')||'').trim(),owner=f.get('employee');if(!name||!owners.some(e=>e[1]===owner))return;const next={id:goal?.id||Date.now(),name,employee:owner,category:f.get('category'),due:f.get('due'),progress:Number(f.get('progress')),milestones:String(f.get('milestones')||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean)};goal?Object.assign(goal,next):data.goals.push(next);save();closeModal();render();toast('Goal saved')}};

const pmsTablePages={},pmsTableSignatures={},pmsPageSize=8;
function pmsTablePage(key,total,signature){

  return pmsTablePages[key];
}
function pmsPager(key,total,draw){
  const count=Math.max(1,Math.ceil(total/pmsPageSize)),current=pmsTablePages[key]||1;
  if(count<=1)return `<div class="pms-pagination"><span>${total} record${total===1?'':'s'}</span></div>`;
  const buttons=Array.from({length:count},(_,i)=>`<button class="${current===i+1?'active':''}" ${current===i+1?'aria-current="page"':''} onclick="pmsTablePages['${key}']=${i+1};${draw}()">${i+1}</button>`).join('');

}
function pmsPaginateDom(key,tbodyId,signature,countId,pagerId,draw){
  const body=$(tbodyId);if(!body)return;

  const total=empty?0:rows.length,page=pmsTablePage(key,total,signature),start=(page-1)*pmsPageSize;

  const count=$(countId);if(count)count.textContent=total?`Showing ${start+1}–${Math.min(start+pmsPageSize,total)} of ${total}`:'0 results';

function pmsDrawDetailRows(){const body=$('#pmsDetailRows');if(!body)return;body.querySelector('#pmsDetailEmpty')?.remove();const tab=urDetailTab,f=pmsDetailFilters[tab],all=[...body.querySelectorAll(':scope > tr')],matched=all.filter(row=>{if(row.querySelector('.empty'))return false;const cells=[...row.cells].map(cell=>cell.textContent.toLowerCase()),q=f.q.toLowerCase();if(!cells.join(' ').includes(q))return false;if(tab==='Participants')return(f.department==='All departments'||cells[1]===f.department.toLowerCase())&&(f.status==='All statuses'||cells[5].includes(f.status.toLowerCase()));if(tab==='Progress')return(f.type==='All types'||cells[1]===f.type.toLowerCase())&&(f.status==='All statuses'||cells[3].includes(f.status.toLowerCase()));return f.department==='All departments'||cells[1]===f.department.toLowerCase()});const page=pmsTablePage('detail-'+tab,matched.length,JSON.stringify([urDetail,tab,f]));all.forEach(row=>row.hidden=true);matched.slice((page-1)*pmsPageSize,page*pmsPageSize).forEach(row=>row.hidden=false);if(!matched.length)body.insertAdjacentHTML('beforeend',`<tr id="pmsDetailEmpty"><td colspan="${all[0]?.cells.length||5}" class="empty">No records match these filters.</td></tr>`);$('#pmsDetailCount').textContent=matched.length?`Showing ${(page-1)*pmsPageSize+1}–${Math.min(page*pmsPageSize,matched.length)} of ${matched.length}`:'0 results';$('#pmsDetailPager').innerHTML=pmsPager('detail-'+tab,matched.length,'pmsDrawDetailRows')}

</script><script>/* One dashboard renderer; each role supplies its permitted records and panel configuration. */
let pmsDashboardCycle='all',pmsDashboardLoading=false;
let pmsDashboardFilters={period:'This Quarter',department:'All Departments',start:'',end:''};
function pmsDashboardRange(){
  const year=Number(urToday.slice(0,4)),month=Number(urToday.slice(5,7))-1,iso=d=>d.toISOString().slice(0,10),f=pmsDashboardFilters;
  if(f.period==='Custom Date Range')return {start:f.start,end:f.end,valid:!!f.start&&!!f.end&&f.start<=f.end};
  const first=f.period==='This Year'?0:f.period==='This Quarter'?Math.floor(month/3)*3:month,months=f.period==='This Year'?12:f.period==='This Quarter'?3:1;
  return {start:iso(new Date(Date.UTC(year,first,1))),end:iso(new Date(Date.UTC(year,first+months,0))),valid:true};
}
function pmsDashboardOverlaps(start,end,range){return range.valid&&!!start&&!!end&&start<=range.end&&end>=range.start}
function pmsDashboardCycleMatches(c,range=pmsDashboardRange()){return pmsDashboardOverlaps(c.periodStart,c.periodEnd,range)}
function pmsDashboardGoalMatches(g,range=pmsDashboardRange()){return pmsDashboardOverlaps(g.periodStart||g.startDate||g.due,g.periodEnd||g.due,range)}
function pmsDashboardSetFilter(key,value){
  const focusedLabel=document.activeElement?.getAttribute('aria-label');
  if(key==='cycle')pmsDashboardCycle=value;else pmsDashboardFilters[key]=value;
  if(key==='period'&&value==='Custom Date Range'&&!pmsDashboardFilters.start){const quarter=pmsDashboardRangeForQuarter();pmsDashboardFilters.start=quarter.start;pmsDashboardFilters.end=quarter.end}
  render();
  if(focusedLabel)document.querySelector(`.pms-dash-filters [aria-label="${focusedLabel}"]`)?.focus();
}
function pmsDashboardRangeForQuarter(){const prior=pmsDashboardFilters.period;pmsDashboardFilters.period='This Quarter';const range=pmsDashboardRange();pmsDashboardFilters.period=prior;return range}
function pmsDashboardData(){
  const range=pmsDashboardRange(),department=urHr()?pmsDashboardFilters.department:'All Departments';
  const employees=scopedEmployees().filter(e=>department==='All Departments'||e[3]===department),names=new Set(employees.map(e=>e[1]));
  const goals=scopedGoals().filter(g=>names.has(g.employee)&&pmsDashboardGoalMatches(g,range));
  const visible=UR.assignments.filter(a=>urVisible(a)&&urCycle(a.cycle)?.status!=='Cancelled');
  const cycles=UR.cycles.filter(c=>urHr()||visible.some(a=>a.cycle===c.id)||c.participants.some(id=>viewRole==='Manager'&&urTeam(id)));
  if(pmsDashboardCycle!=='all'&&!cycles.some(c=>c.id===pmsDashboardCycle))pmsDashboardCycle='all';
  const reviews=visible.filter(a=>(viewRole==='Employee'||pmsDashboardCycle==='all'||a.cycle===pmsDashboardCycle)&&(viewRole!=='Employee'||a.reviewer===urUser())&&(department==='All Departments'||urPerson(a.subject).department===department)&&pmsDashboardCycleMatches(urCycle(a.cycle),range));
  const pending=reviews.filter(a=>urCycle(a.cycle).status==='Active'&&['Not Started','In Progress'].includes(a.state));
  const mine=pending.filter(a=>a.reviewer===urUser()).sort((a,b)=>a.deadline.localeCompare(b.deadline));
  const completed=reviews.filter(a=>a.state==='Completed');
  const overdueGoals=goals.filter(g=>g.due<urToday&&Number(g.progress)<100);
  const average=goals.length?Math.round(goals.reduce((n,g)=>n+Number(g.progress||0),0)/goals.length):null;
  return {employees,goals,cycles,reviews,pending,mine,completed,overdueGoals,average,range,department,rate:reviews.length?Math.round(completed.length/reviews.length*100):null};
}
function pmsDashEmpty(message){return `<div class="pms-dash-empty">${esc(message)}</div>`}
function pmsDashPanel(title,subtitle,body){return `<section class="panel pms-dash-panel"><div class="panelhead"><div><h2>${esc(title)}</h2>${subtitle?`<p>${esc(subtitle)}</p>`:''}</div></div><div class="pms-dash-body">${body}</div></section>`}
function pmsDashMetric(label,value,note,action){return `<button class="stat pms-dash-stat" onclick="${action}"><span class="top">${esc(label)}<span class="symbol" aria-hidden="true">↗</span></span><strong>${esc(value)}</strong><small>${esc(note)}</small></button>`}
function pmsDashboardOpenReviews(scope='all',status='All statuses',department='All departments'){
  const cycle=viewRole==='Employee'||pmsDashboardCycle==='all'?'All cycles':urCycle(pmsDashboardCycle).name;
  if(urHr()&&department==='All departments'&&pmsDashboardFilters.department!=='All Departments')department=pmsDashboardFilters.department;
  urFilter={view:scope==='mine'?'My Reviews':scope==='team'?'Team Reviews':'All Reviews',q:'',cycle,type:'All types',department,status};
  navigate('Reviews');
}
function pmsDashboardOpenGoals(kind='all',owner='',category=''){
  const key=viewRole==='Employee'?'mine':'admin';
  pmsClearGoalFilters(key);
  if(viewRole==='Employee')pmsClearGoalFilters('assigned');
  if(kind==='overdue')pmsGoalFilters[key].due='Overdue';
  if(owner&&key==='admin')pmsGoalFilters.admin.owner=owner;
  if(category)pmsGoalFilters[key].category=category;
  navigate('Goals');
}
function pmsDashboardOpenGoal(id){const g=scopedGoals().find(g=>g.id===id);if(!g)return;roleGoal(id)}
function pmsDashBars(rows,empty='No goal data available.'){
  if(!rows.length)return pmsDashEmpty(empty);
  return `<div class="pms-dash-bars">${rows.map(r=>`<button class="pms-dash-bar" onclick="${r.action}" aria-label="${esc(r.label)}: ${r.value===null?'No data':r.value+'%'}"><span>${esc(r.label)}${r.note?`<small>${esc(r.note)}</small>`:''}</span><span class="track"><i style="width:${r.value??0}%"></i></span><b>${r.value===null?'—':r.value+'%'}</b></button>`).join('')}<div class="pms-dash-axis"><span>0%</span><span>50%</span><span>100%</span></div></div>`;
}
function pmsDashDonut(rows,scope){
  if(!rows.length)return pmsDashEmpty('No review assignments match these filters.');
  const states=['Not Started','In Progress','Submitted','Completed'],colors=['#bccbd8','#73abda','#ab96d5','#6dbb9b'];let offset=0;
  const parts=states.map((state,i)=>{const count=rows.filter(a=>a.state===state).length,pct=count/rows.length*100;const part=`<circle cx="70" cy="70" r="52" fill="none" stroke="${colors[i]}" stroke-width="15" pathLength="100" stroke-dasharray="${pct} ${100-pct}" stroke-dashoffset="${-offset}"/>`;offset+=pct;return part}).join('');
  const rate=Math.round(rows.filter(a=>a.state==='Completed').length/rows.length*100),overdue=rows.filter(a=>['Not Started','In Progress'].includes(a.state)&&a.deadline<urToday).length;
  return `<div class="pms-dash-donut"><svg viewBox="0 0 140 140" role="img" aria-label="${rate}% completed across ${rows.length} review assignments"><g transform="rotate(-90 70 70)">${parts}</g><text x="70" y="68" text-anchor="middle" class="pms-donut-value">${rate}%</text><text x="70" y="86" text-anchor="middle" class="pms-donut-label">COMPLETED</text></svg><div class="pms-dash-legend">${states.map((state,i)=>`<button onclick="pmsDashboardOpenReviews('${scope}','${state}')"><i style="background:${colors[i]}"></i><span>${state}</span><b>${rows.filter(a=>a.state===state).length}</b></button>`).join('')}</div></div><p class="pms-dash-note">${overdue} overdue · included in Not Started or In Progress</p>`;
}
function pmsDashReviewList(rows){return rows.length?`<div class="pms-dash-list">${rows.slice(0,4).map(a=>`<div class="pms-dash-list-row"><div><b>${esc(urCycle(a.cycle).name)}</b><p>${esc(a.type)}${viewRole==='Manager'?' · '+esc(urPerson(a.subject).name):''}</p><small class="${a.deadline<urToday?'pms-due-overdue':''}">${a.deadline<urToday?'Overdue · ':''}Due ${date(a.deadline)}</small></div><div class="pms-dash-row-action">${urBadge(a.state)}<button class="textbtn" onclick="urOpenReview('${a.id}')">${a.state==='In Progress'?'Continue Review':'Start Review'} →</button></div></div>`).join('')}${rows.length>4?`<button class="textbtn pms-dash-view-all" onclick="pmsDashboardOpenReviews('mine')">View all ${rows.length} assigned reviews →</button>`:''}</div>`:pmsDashEmpty('You have no reviews awaiting your response.')}
function pmsDashGoalDeadlines(goals){const rows=goals.filter(g=>Number(g.progress)<100).sort((a,b)=>a.due.localeCompare(b.due));return rows.length?`<div class="pms-dash-list">${rows.slice(0,4).map(g=>`<div class="pms-dash-list-row"><div><b>${esc(g.name)}</b><small class="${g.due<urToday?'pms-due-overdue':''}">${g.due<urToday?'Overdue · ':''}${date(g.due)} · ${g.progress}% complete</small></div><button class="textbtn" onclick="pmsDashboardOpenGoal(${Number(g.id)})">View Goal →</button></div>`).join('')}</div>`:pmsDashEmpty('No upcoming goal deadlines.')}
function pmsDashAction(title,text,label,action){return `<div class="pms-dash-list-row"><div><b>${esc(title)}</b><p>${esc(text)}</p></div><button class="textbtn" onclick="${action}">${esc(label)} →</button></div>`}
function pmsDashNextActions(d){
  if(urHr()){
    const cycles=d.cycles.filter(c=>(pmsDashboardCycle==='all'||c.id===pmsDashboardCycle)&&pmsDashboardCycleMatches(c,d.range)&&(d.department==='All Departments'||c.participants.some(id=>urPerson(id).department===d.department))),drafts=cycles.filter(c=>c.status==='Draft'),ready=cycles.filter(c=>c.status==='Active'&&urCycleAssignments(c).length&&urCycleAssignments(c).every(a=>['Submitted','Completed'].includes(a.state))),releasable=cycles.filter(c=>c.status==='Completed'&&!c.released),due=cycles.filter(c=>c.status==='Active').sort((a,b)=>a.deadline.localeCompare(b.deadline)).slice(0,3);
    return `<div class="pms-dash-list">${ready.slice(0,1).map(c=>pmsDashAction('Ready to finalize',c.name,'Open Cycle',`urOpenCycle('${c.id}')`)).join('')}${releasable.slice(0,1).map(c=>pmsDashAction('Results awaiting release',c.name,'Open Cycle',`urOpenCycle('${c.id}')`)).join('')}${drafts.slice(0,1).map(c=>pmsDashAction('Continue cycle setup',c.name,'Continue',`urStartWizard('${c.id}')`)).join('')}${due.map(c=>pmsDashAction(c.name,`Submission deadline · ${date(c.deadline)}`,'View Cycle',`urOpenCycle('${c.id}')`)).join('')}${pmsDashAction('Plan the next review cycle','Set participants, evaluators, and dates.','Create Cycle','urStartWizard(null,true)')}</div>`;
  }
  const next=d.mine[0],actions=[];
  if(next)actions.push(pmsDashAction('Your next evaluation',`${urPerson(next.subject).name} · Due ${date(next.deadline)}`,next.state==='In Progress'?'Continue Review':'Start Review',`urOpenReview('${next.id}')`));
  if(viewRole==='Manager'){
    if(d.overdueGoals.length)actions.push(pmsDashAction(`${d.overdueGoals.length} overdue team goals`,'Follow up on progress and blockers.','View Goals',"pmsDashboardOpenGoals('overdue')"));
    actions.push(pmsDashAction('Check in with your team',`${d.employees.length} direct reports`,'View Team',"navigate('My Team')"));
  }else{
    const goal=d.goals.filter(g=>Number(g.progress)<100).sort((a,b)=>a.due.localeCompare(b.due))[0];
    if(goal)actions.push(pmsDashAction('Update your goal progress',goal.name,'View Goal',`pmsDashboardOpenGoal(${Number(goal.id)})`));
    actions.push(pmsDashAction('Plan your next goal','Add a personal development or performance goal.','Create Goal','pmsOpenSelfGoal()'));
  }
  return `<div class="pms-dash-list">${actions.join('')}</div>`;
}
function pmsDashboardConfig(d){
  const avg=d.average===null?'—':d.average+'%',mine="pmsDashboardOpenReviews('mine')",all="pmsDashboardOpenReviews()",goals='pmsDashboardOpenGoals()';
  if(urHr()){
    const departments=[...new Set(d.employees.map(e=>e[3]))].sort();
    const goalBars=departments.map(department=>{const names=d.employees.filter(e=>e[3]===department).map(e=>e[1]),gs=d.goals.filter(g=>names.includes(g.employee));return {label:department,value:gs.length?Math.round(gs.reduce((n,g)=>n+Number(g.progress||0),0)/gs.length):null,note:gs.length+(gs.length===1?' goal':' goals'),action:goals}});
    const reviewBars=departments.map(department=>{const rows=d.reviews.filter(a=>urPerson(a.subject).department===department);return {label:department,value:rows.length?Math.round(rows.filter(a=>a.state==='Completed').length/rows.length*100):null,note:rows.length+' assignments',action:`pmsDashboardOpenReviews('all','All statuses','${department}')`}});

  }
  if(viewRole==='Manager')return {metrics:[['Team Members',d.employees.length,'Direct reports assigned to you',"navigate('My Team')"],['Pending Evaluations',d.mine.length,'Your Not Started or In Progress reviews',mine],['Average Team Goal Progress',avg,d.goals.length+' team goals · selected period',goals],['Overdue Goals',d.overdueGoals.length,'Past due and below 100% progress',"pmsDashboardOpenGoals('overdue')"]],panels:[['Team Goal Progress','Goals in period by team member',pmsDashBars((d.goals.length?d.employees:[]).map(e=>{const gs=d.goals.filter(g=>g.employee===e[1]);return {label:e[1],value:gs.length?Math.round(gs.reduce((n,g)=>n+Number(g.progress||0),0)/gs.length):null,note:gs.length+(gs.length===1?' goal':' goals'),action:`pmsDashboardOpenGoals('all','${e[1]}')`}}))],['Team Review Status','Direct reports · evaluation period',pmsDashDonut(d.reviews.filter(a=>urTeam(a.subject)),'team')],['Pending Evaluations','Assigned to you · earliest deadline first',pmsDashReviewList(d.mine)],['Next Actions','',pmsDashNextActions(d)]]};
  return {metrics:[['My Goals',d.goals.length,'Personal and assigned goals',goals],['Average Goal Progress',avg,'Goals in the selected period',goals],['Pending Reviews',d.mine.length,'Your Not Started or In Progress reviews',mine],['Completed Reviews',d.completed.length,'Your finalized review assignments',"pmsDashboardOpenReviews('mine','Completed')"]],panels:[['My Goal Progress','Personal and assigned goals',pmsDashBars(d.goals.map(g=>({label:g.name,value:Number(g.progress||0),note:pmsOwnGoal(g)?'Personal goal':'Assigned goal',action:`pmsDashboardOpenGoal(${Number(g.id)})`})))],['My Pending Reviews','Assigned to you · earliest deadline first',pmsDashReviewList(d.mine)],['Upcoming Goal Deadlines','Incomplete goals · earliest deadline first',pmsDashGoalDeadlines(d.goals)],['Next Actions','',pmsDashNextActions(d)]]};
}
function pmsDashboardHeader(d){
  const description='Monitor review activity and goal progress across your organization.',f=pmsDashboardFilters,custom=f.period==='Custom Date Range';
  const toolbarSelect=(label,value,options,code,extra='')=>`<label class="pms-dash-control ${extra}"><span class="pms-visually-hidden">${label}</span><select aria-label="${label}" title="${label}" onchange="${code}">${options.map(o=>`<option value="${esc(o.value??o)}" ${(o.value??o)===value?'selected':''}>${esc(o.label??o)}</option>`).join('')}</select></label>`;
  const period=toolbarSelect('Period',f.period,['This Month','This Quarter','This Year','Custom Date Range'],"pmsDashboardSetFilter('period',this.value)",'pms-dash-period-filter');
  const cycle=viewRole!=='Employee'?toolbarSelect('Dashboard review cycle',pmsDashboardCycle,[{value:'all',label:'All Cycles'},...d.cycles.map(c=>({value:c.id,label:c.name}))],"pmsDashboardSetFilter('cycle',this.value)",'pms-dash-cycle-filter'):'';
  const department=urHr()?toolbarSelect('Department',f.department,['All Departments',...new Set(data.employees.map(e=>e[3]))],"pmsDashboardSetFilter('department',this.value)",'pms-dash-department-filter'):'';
  const dates=custom?`<label class="pms-dash-control pms-dash-date-filter"><span class="pms-visually-hidden">Start Date</span><input type="date" required aria-invalid="${!d.range.valid}" aria-label="Dashboard start date" title="Start date" value="${esc(f.start)}" max="${esc(f.end)}" onchange="pmsDashboardSetFilter('start',this.value)"></label><label class="pms-dash-control pms-dash-date-filter"><span class="pms-visually-hidden">End Date</span><input type="date" required aria-invalid="${!d.range.valid}" aria-label="Dashboard end date" title="End date" value="${esc(f.end)}" min="${esc(f.start)}" onchange="pmsDashboardSetFilter('end',this.value)"></label>`:'';
  return `<div class="pms-dash-header"><div class="pms-dash-title"><h1>Dashboard</h1><p>${description}</p></div><div class="pms-dash-filters" role="group" aria-label="Dashboard filters">${period}${cycle}${department}${dates}</div></div>${!d.range.valid?'<div class="urerror pms-dash-filter-error" role="alert">Choose a start and end date. The end date must be on or after the start date.</div>':''}`;
}
function pmsDashboard(){
  const d=pmsDashboardData();
  if(!d.range.valid)return `<div class="pms-dashboard">${pmsDashboardHeader(d)}${pmsDashEmpty('Set a valid reporting period to view dashboard data.')}</div>`;

}
