</style></head><body><aside><div class="logo">HRDotNet Performance</div><div class="company"><b>MC</b><span>Mayon Consolidated Inc.<small>Main company</small></span><svg class="pms-unified-chevron pms-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div><div class="navlabel">WORKSPACE</div><nav id="nav"></nav><div class="sidefoot"></div></aside><div class="shell"><header class="pms-topbar"><div class="pms-header-actions"><button id="pmsWorkflowButton" class="pms-icon-button" type="button" title="Workflow guide" aria-label="Open workflow guide" aria-haspopup="dialog" aria-controls="pmsWorkflowDialog" aria-expanded="false" onclick="pmsWorkflowOpen()"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="5" rx="1"/><rect x="2" y="16" width="7" height="5" rx="1"/><rect x="15" y="16" width="7" height="5" rx="1"/><path d="M12 8v4M5.5 16v-4h13v4"/></svg></button><div class="pms-header-popover-host"><button id="pmsNotificationsButton" class="pms-icon-button" type="button" aria-label="Notifications" aria-haspopup="true" aria-expanded="false" aria-controls="pmsNotificationsMenu" onclick="pmsToggleHeaderMenu('notifications')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button><div id="pmsNotificationsMenu" class="pms-header-menu pms-notifications-menu" hidden></div></div><button id="pmsSettingsButton" class="pms-icon-button" type="button" aria-label="Settings" onclick="pmsOpenSettings()"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06-1.88 1.88-.06-.06A1.7 1.7 0 0 0 16 18.4a1.7 1.7 0 0 0-1 1.56V20h-6v-.04A1.7 1.7 0 0 0 8 18.4a1.7 1.7 0 0 0-1.87.34l-.06.06-1.88-1.88.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1H3v-4h.04A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87L4.2 7.07l1.88-1.88.06.06A1.7 1.7 0 0 0 8 5.6a1.7 1.7 0 0 0 1-1.56V4h6v.04A1.7 1.7 0 0 0 16 5.6a1.7 1.7 0 0 0 1.87-.34l.06-.06 1.88 1.88-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1H21v4h-.04A1.7 1.7 0 0 0 19.4 15Z"/></svg></button><div class="pms-header-popover-host"><button id="pmsProfileButton" class="pms-profile-button" type="button" aria-label="Profile and user type" aria-haspopup="true" aria-expanded="false" aria-controls="pmsProfileMenu" onclick="pmsToggleHeaderMenu('profile')"><span class="avatar">MA</span></button><div id="pmsProfileMenu" class="pms-header-menu pms-profile-menu" role="menu" aria-label="Profile menu" hidden></div></div></div></header><div id="rolebar" hidden></div><main><div id="content"></div></main></div><dialog id="modal"></dialog><div id="toast" role="status"></div><script>const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial={employees:[['EMP-001','Maria Cruz','Product Designer','Design','Angela Reyes',75,'Manager review'],['EMP-002','James Santos','Software Engineer','Engineering','Angela Reyes',90,'Completed'],['EMP-003','Sofia Garcia','Marketing Specialist','Marketing','Daniel Lim',60,'Self-assessment'],['EMP-004','Daniel Lim','Marketing Lead','Marketing','Angela Reyes',85,'Manager review'],['EMP-005','Isabel Tan','HR Specialist','Human Resources','Angela Reyes',100,'Completed'],['EMP-006','Miguel Reyes','QA Engineer','Engineering','Angela Reyes',45,'Not started']],goals:[{id:1,name:'Improve design handoff quality',employee:'Maria Cruz',category:'Quality',progress:75,due:'2026-10-30'},{id:2,name:'Reduce API response time by 20%',employee:'James Santos',category:'Delivery',progress:90,due:'2026-10-30'},{id:3,name:'Launch the Q4 campaign',employee:'Sofia Garcia',category:'Growth',progress:60,due:'2026-10-30'},{id:4,name:'Increase qualified leads by 15%',employee:'Daniel Lim',category:'Growth',progress:85,due:'2026-10-30'},{id:5,name:'Complete onboarding improvements',employee:'Isabel Tan',category:'Quality',progress:100,due:'2026-10-30'},{id:6,name:'Automate regression test suite',employee:'Miguel Reyes',category:'Delivery',progress:45,due:'2026-10-30'}],reviews:{},cycle:{name:'Q4 2026 Performance Review',due:'2026-10-30',status:'Active'}};
let data;try{data=JSON.parse(localStorage.getItem('people-mvp-v1'))||structuredClone(initial)}catch{data=structuredClone(initial)}let page='Overview',tab='All employees',query='',department='All departments',status='All statuses';
let save=()=>localStorage.setItem('people-mvp-v1',JSON.stringify(data));const initials=n=>n.split(' ').map(x=>x[0]).join('').slice(0,2);const person=e=>`<div class="person"><span class="avatar">${initials(e[1])}</span><div>${esc(e[1])}<small>${esc(e[2])}</small></div></div>`;const badge=s=>`<span class="pill ${s==='Completed'||s==='Active'?'green':s==='Manager review'?'blue':s==='Self-assessment'?'purple':'orange'}">${esc(s)}</span>`;const progress=n=>`<div class="progress"><div class="track"><i style="width:${n}%"></i></div>${n}%</div>`;const date=s=>new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3200)}
function navigate(p){page=p;query='';department='All departments';status='All statuses';tab='All employees';render()}
const navs=[['Overview','▦'],['Employees','♧'],['Goals & KPIs','◎'],['Performance reviews','▤'],['Review cycles','◷'],['Reports','▥']];
function head(title,sub,action=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function statcards(){let done=data.employees.filter(e=>e[6]==='Completed').length,pending=data.employees.filter(e=>e[6]==='Manager review').length,avg=Math.round(data.goals.reduce((a,g)=>a+g.progress,0)/data.goals.length)||0;return `<div class="stats">${[['Total employees',data.employees.length,'Across '+new Set(data.employees.map(e=>e[3])).size+' departments','♧'],['Reviews completed',`${done}<span style="font-size:16px;color:#a1adba"> / ${data.employees.length}</span>`,Math.round(done/data.employees.length*100)+'% completion rate','✓'],['Awaiting manager',pending,'Ready for your feedback','▤'],['Average goal progress',avg+'%','Across '+data.goals.length+' active goals','◎']].map(x=>`<div class="stat"><div class="top">${x[0]}<span class="symbol">${x[3]}</span></div><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div>`}
function cyclebar(){return `<div class="cyclebar"><div><span class="cycleicon">◷</span><div><h3>${esc(data.cycle.name)}</h3><p style="font-size:11px">Goals, growth, and meaningful conversations.</p></div>${badge(data.cycle.status)}</div><div><span style="font-size:11px;color:#8b9ba8">Due ${date(data.cycle.due)}</span><button onclick="navigate('Review cycles')">View cycle ↗</button></div></div>`}
function employeeTable(review=false,overview=false){let rows=data.employees.filter(e=>(e.join(' ').toLowerCase().includes(query.toLowerCase()))&&(department==='All departments'||e[3]===department)&&(status==='All statuses'||e[6]===status)&&(tab!=='Awaiting my review'||e[6]==='Manager review')&&(tab!=='Completed'||e[6]==='Completed'));return `<section class="panel"><div class="panelhead"><div><h2>${overview?'Team performance':review?'Review workspace':'Employee directory'}</h2><p>${overview?'A clear view of your people and their progress.':review?'Complete self-assessments and manager evaluations.':'Maintain employee profiles and reporting lines.'}</p></div><button onclick="exportCSV()">↓ Export CSV</button></div>${review||overview?`<div class="tabs">${['All employees','Awaiting my review','Completed'].map(t=>`<button class="${tab===t?'selected':''}" onclick="tab='${t}';render()">${t}${t==='Awaiting my review'?' · '+data.employees.filter(e=>e[6]==='Manager review').length:''}</button>`).join('')}</div>`:''}<div class="toolbar"><input aria-label="Search employees" class="search" id="search" placeholder="⌕  Search name, role, or employee ID…" value="${esc(query)}"><select aria-label="Department" id="dept">${['All departments',...new Set(data.employees.map(e=>e[3]))].map(d=>`<option ${department===d?'selected':''}>${esc(d)}</option>`).join('')}</select><select aria-label="Review status" id="status">${['All statuses','Not started','Self-assessment','Manager review','Completed'].map(s=>`<option ${status===s?'selected':''}>${s}</option>`).join('')}</select><button class="right textbtn" onclick="query='';department='All departments';status='All statuses';render()">Clear filters</button></div><div class="tablewrap"><table><thead><tr><th>EMPLOYEE ↕</th><th>DEPARTMENT</th><th>${review||overview?'GOAL PROGRESS':'REPORTS TO'}</th><th>REVIEW STATUS</th><th>${review||overview?'DUE DATE':'EMPLOYEE ID'}</th><th></th></tr></thead><tbody>${rows.map(e=>`<tr><td>${person(e)}</td><td>${esc(e[3])}</td><td>${review||overview?progress(employeeProgress(e[1])):esc(e[4])}</td><td>${badge(e[6])}</td><td style="color:#8493a1">${review||overview?date(data.cycle.due):e[0]}</td><td><button class="textbtn" onclick="${review||overview?'openReview':'openEmployee'}('${e[0]}')">${review||overview?(e[6]==='Completed'?'View review':'Open review'):'Edit profile'} ↗</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No employees match your filters.</td></tr>'}</tbody></table></div><div class="tablefoot"><span>Showing ${rows.length} of ${data.employees.length} employees</span><span>Page <b style="color:#529cdc">1</b> of 1</span></div></section>`}
function employeeProgress(name){let goals=data.goals.filter(g=>g.employee===name);return goals.length?Math.round(goals.reduce((a,g)=>a+g.progress,0)/goals.length):0}
function render(){ $('#nav').innerHTML=navs.map(([n,i])=>`<button class="${page===n?'active':''}" onclick="navigate('${n}')"><span class="ico">${i}</span>${n}${n==='Performance reviews'?`<span class="count">${data.employees.filter(e=>e[6]!=='Completed').length}</span>`:''}</button>`).join('');let c='';if(page==='Overview'){c=head('Performance overview','A little clarity. A lot of potential. Here’s how your team is doing.',`<button class="gradient" onclick="openGoal()">＋ Create goal</button>`)+cyclebar()+statcards()+employeeTable(false,true)+`<div class="bottomgrid"><section class="panel"><div class="panelhead"><div><h2>Needs your attention</h2><p>Keep the review cycle moving.</p></div><span class="pill blue">${data.employees.filter(e=>e[6]==='Manager review').length} pending</span></div>${data.employees.filter(e=>e[6]==='Manager review').map(e=>`<div class="taskrow"><span class="datebox">▤</span><div><h3>${esc(e[1])}'s manager review</h3><p>Self-assessment submitted · Due ${date(data.cycle.due)}</p></div><button class="textbtn" onclick="openReview('${e[0]}')">Review →</button></div>`).join('')||'<div class="empty">All manager reviews are up to date.</div>'}</section><section class="panel"><div class="panelhead"><div><h2>The review journey</h2><p>One shared process, from goals to growth.</p></div></div><div class="timeline">${[['01','Set goals','Agree on measurable outcomes'],['02','Self-assessment','Reflect on achievements and challenges'],['03','Manager review','Rate performance and share feedback'],['04','Complete','Acknowledge and plan next steps']].map(x=>`<div class="step"><span class="dot"></span><div><h3>${x[1]}</h3><small>${x[2]}</small></div><span class="pill">${x[0]}</span></div>`).join('')}</div></section></div>`}else if(page==='Employees')c=head('Employees','The people behind every milestone.',`<button class="gradient" onclick="openEmployee()">＋ Add employee</button>`)+employeeTable();else if(page==='Performance reviews')c=head('Performance reviews','Make feedback useful. Make progress visible.')+cyclebar()+employeeTable(true);else if(page==='Goals & KPIs')c=head('Goals & KPIs','Align individual effort with measurable outcomes.',`<button class="gradient" onclick="openGoal()">＋ Create goal</button>`)+`<section class="panel"><div class="panelhead"><div><h2>Team goals</h2><p>Track targets, ownership, and progress.</p></div><span class="pill blue">${data.goals.length} goals</span></div><div class="tablewrap"><table><thead><tr><th>GOAL / KEY RESULT</th><th>OWNER</th><th>CATEGORY</th><th>PROGRESS</th><th>DUE DATE</th><th></th></tr></thead><tbody>${data.goals.map(g=>`<tr><td>${esc(g.name)}</td><td>${esc(g.employee)}</td><td><span class="pill">${esc(g.category)}</span></td><td>${progress(g.progress)}</td><td>${date(g.due)}</td><td><button class="textbtn" onclick="openGoal(${g.id})">Update ↗</button></td></tr>`).join('')}</tbody></table></div></section>`;else if(page==='Review cycles')c=head('Review cycles','Give every review a clear timeline and consistent criteria.',`<button class="gradient" onclick="editCycle()">Edit cycle</button>`)+cyclebar()+`<section class="panel"><div class="panelhead"><div><h2>Cycle configuration</h2><p>A simple, consistent review process for every employee.</p></div>${badge(data.cycle.status)}</div><div class="modalbody"><div class="formgrid"><div><small>PARTICIPANTS</small><h2 style="margin-top:12px">${data.employees.length} employees · All departments</h2></div><div><small>DEADLINE</small><h2 style="margin-top:12px">${date(data.cycle.due)}</h2></div></div><div class="notice">Rating scale: 1 — Needs improvement · 2 — Developing · 3 — Meets expectations · 4 — Exceeds expectations · 5 — Outstanding</div><h2>Evaluation criteria</h2><p>Goal achievement, quality of work, and collaboration carry equal weight. The overall rating is their arithmetic mean. Goal progress is tracked separately.</p><br><h2>Workflow</h2><p>Not started → Self-assessment → Manager review → Completed</p><br><p>Employee acknowledgment is recorded after the manager submits the review.</p></div></section>`;else c=head('Reports','Understand completion and progress at a glance.',`<button onclick="exportCSV()">↓ Export CSV</button>`)+statcards()+`<div class="bottomgrid"><section class="panel"><div class="panelhead"><div><h2>Goal progress by department</h2><p>Average progress across employee goals.</p></div></div><div class="bars">${[...new Set(data.employees.map(e=>e[3]))].map(d=>{let es=data.employees.filter(e=>e[3]===d),n=Math.round(es.reduce((a,e)=>a+employeeProgress(e[1]),0)/es.length);return `<div class="barrow"><span>${esc(d)}</span><div class="track"><i style="width:${n}%"></i></div><span>${n}%</span></div>`}).join('')}</div></section><section class="panel"><div class="panelhead"><div><h2>Review completion</h2><p>Current cycle status breakdown.</p></div></div><div class="bars">${['Not started','Self-assessment','Manager review','Completed'].map(s=>{let n=data.employees.filter(e=>e[6]===s).length;return `<div class="barrow"><span>${s}</span><div class="track"><i style="width:${n/data.employees.length*100}%"></i></div><span>${n}</span></div>`}).join('')}</div></section></div>`;$('#content').innerHTML=c;if($('#search')){$('#search').oninput=e=>{let pos=e.target.selectionStart;query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};$('#dept').onchange=e=>{department=e.target.value;render()};$('#status').onchange=e=>{status=e.target.value;render()}}}
function modal(title,sub,body,buttons){$('#modal').innerHTML=`<div class="modalhead"><div><h2>${title}</h2><p style="font-size:11px">${sub}</p></div><button type="button" class="pms-modal-close" aria-label="Close dialog" onclick="closeModal()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>${body}${buttons?`<div class="modalfoot">${buttons}</div>`:''}`;$('#modal').showModal()}function closeModal(){$('#modal').close()}
function openEmployee(id){let e=data.employees.find(e=>e[0]===id);modal(e?'Employee profile':'Add employee','Employee details and reporting line',`<form id="employeeForm"><div class="modalbody"><div class="formgrid">${[['name','Full name',e?.[1]],['role','Job title',e?.[2]],['department','Department',e?.[3]],['manager','Manager',e?.[4]]].map(([n,l,v])=>`<label>${l}<input name="${n}" required maxlength="70" value="${esc(v||'')}"></label>`).join('')}</div></div><div class="modalfoot"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Save employee</button></div></form>`);$('#employeeForm').onsubmit=ev=>{ev.preventDefault();let f=new FormData(ev.target),vals=['name','role','department','manager'].map(k=>f.get(k).trim());if(vals.some(v=>!v))return;if(e){let old=e[1];e.splice(1,4,...vals);data.goals.forEach(g=>{if(g.employee===old)g.employee=vals[0]})}else data.employees.push(['EMP-'+String(Math.max(...data.employees.map(e=>+e[0].split('-')[1]))+1).padStart(3,'0'),...vals,0,'Not started']);save();closeModal();render();toast('Employee saved')};}
function openGoal(id){let g=data.goals.find(g=>g.id===id);modal(g?'Update goal':'Create goal','Define a measurable outcome and keep progress current.',`<form id="goalForm"><div class="modalbody"><div class="formgrid"><label class="full">Goal / measurable target<input name="name" required maxlength="140" placeholder="e.g. Reduce support response time to 4 hours" value="${esc(g?.name||'')}"></label><label>Owner<select name="employee">${data.employees.map(e=>`<option ${g?.employee===e[1]?'selected':''}>${esc(e[1])}</option>`).join('')}</select></label><label>Category<select name="category">${['Quality','Delivery','Growth','Collaboration'].map(c=>`<option ${g?.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Due date<input name="due" type="date" required value="${g?.due||data.cycle.due}"></label><label>Progress (%)<input name="progress" type="number" required min="0" max="100" value="${g?.progress||0}"></label></div></div><div class="modalfoot"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Save goal</button></div></form>`);$('#goalForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),v={id:g?.id||Date.now(),name:f.get('name').trim(),employee:f.get('employee'),category:f.get('category'),due:f.get('due'),progress:+f.get('progress')};if(!v.name)return;g?Object.assign(g,v):data.goals.push(v);save();closeModal();render();toast('Goal saved')};}
function openReview(id){let e=data.employees.find(x=>x[0]===id),r=data.reviews[id]||{},complete=e[6]==='Completed',self=e[6]==='Not started'||e[6]==='Self-assessment';modal(`${esc(e[1])} · Performance review`,`${esc(data.cycle.name)} · ${esc(e[3])}`,`<form id="reviewForm"><div class="modalbody"><div style="display:flex;justify-content:space-between">${person(e)}${badge(e[6])}</div><div class="notice">Demo role: ${self?'Employee self-assessment':'Manager evaluation'}. Use this screen to walk through the review workflow.</div><h2>Goals & achievements</h2>${data.goals.filter(g=>g.employee===e[1]).map(g=>`<div class="reviewgoal"><p>${esc(g.name)}</p>${progress(g.progress)}</div>`).join('')||'<p>No goals assigned yet.</p>'}<label style="margin-top:18px">Employee reflection<textarea name="reflection" rows="3" ${!self?'readonly':''} ${self?'required':''} placeholder="What went well? What could improve?">${esc(r.reflection||(!self?'Delivered key milestones and identified opportunities to improve collaboration.':''))}</textarea></label>${!self?`<div class="formgrid">${['Goal achievement','Quality of work','Collaboration'].map((l,i)=>`<label>${l}<select name="score${i}" ${complete?'disabled':''}>${[1,2,3,4,5].map(n=>`<option value="${n}" ${(r.scores?.[i]||3)===n?'selected':''}>${n} — ${['Needs improvement','Developing','Meets expectations','Exceeds expectations','Outstanding'][n-1]}</option>`).join('')}</select></label>`).join('')}<label class="full">Manager feedback & development actions<textarea name="feedback" rows="3" ${complete?'readonly':'required'} placeholder="Give specific feedback and agree on the next growth step.">${esc(r.feedback||(complete?'Consistent delivery and positive collaboration. Continue developing ownership of larger initiatives.':''))}</textarea></label></div>${complete?`<div class="notice">Overall rating: <b>${r.scores?(r.scores.reduce((a,b)=>a+b,0)/3).toFixed(1):'3.0'} / 5</b> · ${r.acknowledged?'Acknowledged by employee':'Awaiting employee acknowledgment'}</div>`:''}`:''}</div><div class="modalfoot"><button type="button" onclick="closeModal()">Close</button>${complete?`<button type="button" class="primary" onclick="acknowledge('${id}')" ${r.acknowledged?'disabled':''}>${r.acknowledged?'Acknowledged':'Acknowledge as employee'}</button>`:`<button type="button" onclick="saveReviewDraft('${id}',${self})">Save draft</button><button class="primary">${self?'Submit self-assessment':'Complete manager review'}</button>`}</div></form>`);$('#reviewForm').onsubmit=ev=>{ev.preventDefault();let f=new FormData(ev.target);data.reviews[id]={...r,reflection:f.get('reflection'),...(self?{}:{scores:[0,1,2].map(i=>+f.get('score'+i)),feedback:f.get('feedback')})};e[6]=self?'Manager review':'Completed';save();closeModal();render();toast(self?'Self-assessment submitted to manager':'Manager review completed')};}
function saveReviewDraft(id,self){let f=new FormData($('#reviewForm'));data.reviews[id]={...data.reviews[id],reflection:f.get('reflection'),...(!self?{scores:[0,1,2].map(i=>+f.get('score'+i)),feedback:f.get('feedback')}:{})};if(self)data.employees.find(e=>e[0]===id)[6]='Self-assessment';save();closeModal();render();toast('Review draft saved')}
function acknowledge(id){data.reviews[id]={...data.reviews[id],acknowledged:true};save();closeModal();render();toast('Employee acknowledgment recorded')}
function editCycle(){modal('Edit review cycle','Applies to the current cycle and all participants.',`<form id="cycleForm"><div class="modalbody"><div class="formgrid"><label class="full">Cycle name<input name="name" required value="${esc(data.cycle.name)}"></label><label>Review deadline<input name="due" type="date" required value="${data.cycle.due}"></label><label>Status<select name="status">${['Active','Closed'].map(s=>`<option ${data.cycle.status===s?'selected':''}>${s}</option>`).join('')}</select></label></div><div class="notice">Closing a cycle labels it closed in this prototype. Production should also enforce deadline and edit restrictions.</div></div><div class="modalfoot"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Save cycle</button></div></form>`);$('#cycleForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.cycle=Object.fromEntries(f);save();closeModal();render();toast('Cycle updated')};}

function urQuestionFields(t,answers={},readOnly=false,preview=false){return t.sections.map(section=>`<section class="urformsection"><div class="ursectiontitle"><span>${String(t.sections.indexOf(section)+1).padStart(2,'0')}</span><div><h2>${esc(section)}</h2><small>${t.questions.filter(q=>q.section===section).length} question${t.questions.filter(q=>q.section===section).length===1?'':'s'}</small></div></div>${t.questions.filter(q=>q.section===section).map(q=>{const value=answers[q.id]??'',event=`onchange="${preview?'urPreviewAnswers':'urAnswers'}['${q.id}']=this.value;${preview?'':'urDirty=true;urUpdateCompletion()'}"`,disable=readOnly?'disabled':'';return `<div class="urquestion"><label for="answer-${q.id}">${esc(q.title)} ${q.required?'<span class="required">*</span>':'<span class="urmuted">Optional</span>'}</label>${q.description?`<p>${esc(q.description)}</p>`:''}${q.type==='Rating'?`<div class="ratings">${['Never','Rarely','Sometimes','Often','Always'].map((l,i)=>`<label><input type="radio" name="${q.id}" value="${i+1}" ${String(value)===String(i+1)?'checked':''} ${disable} ${event}><span><b>${i+1}</b>${l}</span></label>`).join('')}${q.notObserved?`<label class="norating"><input type="radio" name="${q.id}" value="NO" ${value==='NO'?'checked':''} ${disable} ${event}><span>Not Observed</span></label>`:''}</div>`:q.type==='Choice'?`<select id="answer-${q.id}" aria-label="${esc(q.title)}" ${disable} ${event}><option value="">Select an answer</option>${q.options.map(o=>`<option ${value===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:q.type==='Short'?`<input id="answer-${q.id}" maxlength="500" value="${esc(value)}" ${readOnly?'readonly':''} aria-label="${esc(q.title)}" oninput="${preview?'urPreviewAnswers':'urAnswers'}['${q.id}']=this.value;${preview?'':'urDirty=true;urUpdateCompletion()'}">`:`<textarea id="answer-${q.id}" rows="3" maxlength="5000" ${readOnly?'readonly':''} aria-label="${esc(q.title)}" oninput="${preview?'urPreviewAnswers':'urAnswers'}['${q. function urBuilder(){if(!urHr()||!urEditor)return urEmpty('Template unavailable','HR access is required.');const t=urEditor,view=urScreen==='templateView';return pmsTemplateBuilderHeader(t,view)+`<div class="urbuilder">${!urPreview?`<small class="pms-builder-status">${t.status==='Draft'?'Draft':'Editing'} · ${t.questions.length} question${t.questions.length===1?'':'s'}</small>`:''}${urPreview?`<div class="panel urintro"><span class="pill blue">Respondent preview</span><h2 style="margin-top:12px">${esc(t.name||'Untitled template')}</h2><p>${esc(t.description)}</p><small>Preview answers are not saved.</small></div>${urQuestionFields(t,urPreviewAnswers,false,true)}`:`${t.original?'<div class="notice">You are creating version '+t.version+'. Published versions and historical responses remain unchanged.</div>':''}<section class="panel urbuilderinfo"><div class="eyebrow">TEMPLATE INFORMATION</div><label>Template Name <span class="required">*</span><input maxlength="120" placeholder="e.g. Quarterly Performance Review" value="${esc(t.name)}" oninput="urEditor.name=this.value;urDirty=true"></label><label>Description / Instructions<textarea rows="3" maxlength="2000" oninput="urEditor.description=this.value;urDirty=true">${esc(t.description)}</textarea></label><div class="formgrid"><label>Template Category<select onchange="urEditor.category=this.value;urDirty=true">${['General Performance','Self-Assessment','Manager Evaluation','Peer Feedback','360° Feedback','Probationary Evaluation'].map(c=>`<option ${t.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Review Type<select onchange="urEditor.type=this.value;urDirty=true">${urTypes.map(c=>`<option ${t.type===c?'selected':''}>${c}</option>`).join('')}</select></label></div></section>${t.sections.map((section,si)=>`<section class="urbuildsection"><div class="ursectioneditor"><span class="ursectionnumber">${si+1}</span><label>Section title<input aria-label="Section ${si+1} title" value="${esc(section)}" onchange="urRenameSection(${si},this.value)"></label><div class="uractions"><button title="Move section up" ${si===0?'disabled':''} onclick="urMoveSection(${si},-1)">↑</button><button title="Move section down" ${si===t.sections.length-1?'disabled':''} onclick="urMoveSection(${si},1)">↓</button></div></div>${t.questions.filter(q=>q.section===section).map((q,qi)=>urQuestionCard(q,qi)).join('')}<button class="uraddquestion" onclick="urAddQuestion(${si})">＋ Add question to section</button></section>`).join('')}<button class="uraddsection" onclick="urAddSection()">＋ Add Section</button><div id="urBuilderError" class="urerror" role="alert"></div>`}</div>`}
function urQuestionCard(q,index){const group=urEditor.questions.filter(x=>x.section===q.section);return `<div class="panel urquestioncard"><div class="urquestioncardhead"><span>QUESTION ${index+1}</span><div class="uractions"><button title="Move question up" ${index===0?'disabled':''} onclick="urMoveQuestion('${q.id}',-1)">↑</button><button title="Move question down" ${index===group.length-1?'disabled':''} onclick="urMoveQuestion('${q.id}',1)">↓</button><button onclick="urDuplicateQuestion('${q.id}')">Duplicate</button><button onclick="urDeleteQuestion('${q.id}')">Delete</button></div></div><label>Question Title <span class="required">*</span><input aria-label="Question title" maxlength="300" value="${esc(q.title)}" placeholder="Ask about a specific behavior or outcome…" oninput="urSetQuestion('${q.id}','title',this.value)"></label><label>Optional Description<input value="${esc(q.description)}" maxlength="500" oninput="urSetQuestion('${q.id}','description',this.value)"></label><div class="urquestionconfig"><label>Question Type<select aria-label="Question type" onchange="urChangeType('${q.id}',this.value)">${[['Rating','Rating Scale (1–5)'],['Short','Short Answer'],['Paragraph','Paragraph'],['Choice','Multiple Choice']].map(([v,l])=>`<option value="${v}" ${q.type===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="urcheck"><input type="checkbox" ${q.required?'checked':''} onchange="urSetQuestion('${q.id}','required',this.checked)">Required</label>${q.type==='Rating'?`<label class="urcheck"><input type="checkbox" ${q.notObserved?'checked':''} onchange="urSetQuestion('${q.id}','notObserved',this.checked)">Allow Not Observed</label>`:''}</div>${q.type==='Rating'?'<div class="urscalepreview">1 Never <span>2 Rarely</span><span>3 Sometimes</span><span>4 Often</span><span>5 Always</span></div>':q.type==='Choice'?`<div class="uroptions">${q.options.map((o,i)=>`<div><span>○</span><input aria-label="Answer option ${i+1}" value="${esc(o)}" maxlength="150" function urSetQuestion(id,key,value){const q=urEditor.questions.find(q=>q.id===id);q[key]=value;urDirty=true}

function urTemplateErrors(t,publish){const errors=[];if(!t.name.trim())errors.push('Enter a template name.');if(publish){if(!t.questions.length)errors.push('Add at least one question.');if(t.sections.some(s=>!t.questions.some(q=>q.section===s)))errors.push('Add at least one question to every section.');if(t.questions.some(q=>!q.title.trim()))errors.push('Enter a title for each question.');for(const q of t.questions.filter(q=>q.type==='Choice'))if(q.options.length<2||q.options.some(o=>!o.trim())||new Set(q.options.map(o=>o.trim().toLowerCase())).size!==q.options.length)errors.push('Multiple-choice questions need at least two distinct, non-empty options.')}return [...new Set(errors)]}

  const back=action.includes('←')?action.replace('<button','<button class="pms-back-link"'):'';
  const actions=back?'':action;
  return `<div class="pagehead pms-nested-head">${back?`<div class="pms-back-row">${back}</div>`:''}<div class="pms-nested-title-row"><div><h1>${esc(title)}</h1><p>${esc(description)}</p></div>${actions?`<div class="pms-page-actions">${actions}</div>`:''}</div></div>`;

function pmsHrEmployee(id){return data.employees.find(e=>e[0]===id)}

function pmsAssignmentDate(value){return typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value)&&!Number.isNaN(Date.parse(value))&&new Date(value+'T12:00:00Z').toISOString().slice(0,10)===value}
function pmsAssignmentCompany(){return data.pmsActiveCompanyId||'mayon'}
function pmsAssignmentInCompany(id,company){const e=pmsHrEmployee(id);return !!e&&(!e.companyId&&!data.pmsEmployeeCompanies?.[id]||(e.companyId||data.pmsEmployeeCompanies?.[id])===company)}
function pmsOfficialManagerId(id){const person=urPerson(id);return urPeople().find(p=>p.name===person.manager)?.id||''}
function pmsManagerId(id){const override=data.pmsManagerAssignments[id];return override&&(override.scheduledAssignmentId||!override.effective||override.effective<=urToday)?override.managerId:pmsOfficialManagerId(id)}
function pmsPendingManagerAssignments(){return (data.pmsPendingManagerAssignments||[]).filter(x=>['Pending','Blocked'].includes(x.status))}
function pmsManagerAssignmentError(entry){
 if(!pmsAssignmentDate(entry.effective))return 'The scheduled effective date is invalid.';
 if(!pmsAssignmentInCompany(entry.employee,entry.companyId))return 'The employee is no longer in the assignment company.';
 if(!pmsManagers().some(m=>m.id===entry.managerId))return 'The selected manager is no longer eligible.';
 if(pmsHrEmployee(entry.managerId)&&!pmsAssignmentInCompany(entry.managerId,entry.companyId))return 'The selected manager is outside the assignment company.';

}
function pmsManagerGraph(){return Object.fromEntries(urPeople().map(p=>[p.id,pmsManagerId(p.id)]))}
function pmsManagerGraphError(graph){
 for(const employee of Object.keys(graph)){let current=employee;const seen=new Set();while(current){if(seen.has(current))return 'The assignments would create a reporting cycle.';seen.add(current);current=graph[current]}}
 return '';
}
function pmsManagerTimelineError(proposals=[]){
 const graph=pmsManagerGraph(),legacy=Object.entries(data.pmsManagerAssignments).filter(([id,x])=>!x.scheduledAssignmentId&&pmsAssignmentDate(x.effective)&&x.effective>urToday).map(([employee,x])=>({...x,employee})),entries=[...pmsPendingManagerAssignments(),...legacy,...proposals],days=[...new Set(entries.map(x=>x.effective))].sort();
 for(const day of days){const group=entries.filter(x=>x.effective===day),employees=new Set();for(const entry of group){if(employees.has(entry.employee))return 'Cancel the existing assignment for this employee and effective date before replacing it.';employees.add(entry.employee);graph[entry.employee]=entry.managerId}const error=pmsManagerGraphError(graph);if(error)return error+' Review the projected reporting hierarchy on '+date(day)+'.'}

function pmsManagerAssignmentEvent(entry,action,reason='',by=urUser()){

function pmsApplyManagerAssignment(entry){

 for(const c of UR.cycles){if(!['Draft','Scheduled','Active'].includes(c.status))continue;if(['Draft','Scheduled'].includes(c.status))c.evaluators?.filter(e=>e.subject===entry.employee&&e.type==='Manager').forEach(e=>e.reviewer=entry.managerId);for(const a of UR.assignments.filter(a=>a.cycle===c.id&&a.subject===entry.employee&&a.type==='Manager'&&a.state==='Not Started')){a.reviewer=entry.managerId;c.evaluators?.filter(e=>e.subject===entry.employee&&e.type==='Manager').forEach(e=>e.reviewer=entry.managerId)}}
 entry.status='Applied';entry.appliedAt=new Date().toISOString();delete entry.error;pmsManagerAssignmentEvent(entry,'Applied','','System');

function pmsProcessManagerAssignments(){
 data.pmsPendingManagerAssignments??=[];let changed=false;
 // Old future overrides have no retained prior override. Keep only the known official baseline until they are due.
 for(const [employee,override] of Object.entries(data.pmsManagerAssignments)){if(override.scheduledAssignmentId||!pmsAssignmentDate(override.effective)||override.effective<=urToday)continue;const entry={id:urUid('manager-assignment'),employee,managerId:override.managerId,effective:override.effective,companyId:(pmsHrEmployee(employee)?.companyId||data.pmsEmployeeCompanies?.[employee]||pmsAssignmentCompany()),status:'Pending',legacy:true,createdAt:null,createdBy:null};data.pmsPendingManagerAssignments.push(entry);delete data.pmsManagerAssignments[employee];pmsManagerAssignmentEvent(entry,'Legacy schedule retained','Only the latest scheduled assignment is known; earlier override history is unavailable.','System');changed=true;}
 const due=pmsPendingManagerAssignments().filter(x=>x.effective<=urToday),days=[...new Set(due.map(x=>x.effective))].sort();
 for(const day of days){const group=due.filter(x=>x.effective===day),graph=pmsManagerGraph(),employees=new Set();let error='';for(const entry of group){error=error||pmsManagerAssignmentError(entry);if(employees.has(entry.employee))error='Multiple pending assignments have the same employee and effective date.';employees.add(entry.employee);const current=data.pmsManagerAssignments[entry.employee];if(current?.effective>entry.effective)error='A newer manager assignment is already effective. Cancel this outdated scheduled assignment.';graph[entry.employee]=entry.managerId}error=error||pmsManagerGraphError(graph);

  for(const entry of group){pmsApplyManagerAssignment(entry);changed=true}

}

const pmsTablePages={},pmsTableSignatures={};let pmsPageSize=10;
function pmsTablePage(key,total,signature){
  if(pmsTableSignatures[key]!==signature){pmsTablePages[key]=1;pmsTableSignatures[key]=signature}
  const maxPage=Math.max(1,Math.ceil(total/pmsPageSize));if((pmsTablePages[key]||1)>maxPage)pmsTablePages[key]=1;pmsTablePages[key]=Math.max(1,pmsTablePages[key]||1);
  return pmsTablePages[key];
}
function pmsSetPageSize(value,draw){const size=Number(value);if(![10,20,50].includes(size))return;pmsPageSize=size;for(const key of Object.keys(pmsTablePages))pmsTablePages[key]=1;draw()}
function pmsPageNumbers(current,count){
 if(count<=7)return Array.from({length:count},(_,i)=>i+1);
 const visible=new Set([1,count]);
 if(current<=3){for(let n=2;n<=4;n++)visible.add(n)}
 else if(current>=count-2){for(let n=count-3;n<count;n++)visible.add(n)}
 else for(let n=current-1;n<=current+1;n++)visible.add(n);
 const pages=[...visible].sort((a,b)=>a-b),items=[];
 pages.forEach((n,i)=>{if(i&&n-pages[i-1]>1)items.push('…');items.push(n)});return items;
}
function pmsPager(key,total,draw){
 const count=Math.max(1,Math.ceil(total/pmsPageSize)),current=Math.max(1,Math.min(pmsTablePages[key]||1,count));
 const numbers=pmsPageNumbers(current,count).map(n=>n==='…'?'<span class="pms-pagination-gap" aria-hidden="true">…</span>':`<button type="button" class="pms-page-number ${n===current?'active':''}" aria-label="Page ${n}" ${n===current?'aria-current="page"':''} onclick="pmsTablePages['${key}']=${n};${draw}()">${n}</button>`).join('');
 return `<div class="pms-pagination" role="group" aria-label="Pagination"><select aria-label="Rows per page" onchange="pmsSetPageSize(this.value,${draw})">${[10,20,50].map(n=>`<option value="${n}" ${pmsPageSize===n?'selected':''}>${n} per page</option>`).join('')}</select><button type="button" aria-label="Previous page" ${current===1?'disabled':''} onclick="pmsTablePages['${key}']=${current-1};${draw}()">Previous</button>${numbers}<button type="button" aria-label="Next page" ${current===count?'disabled':''} onclick="pmsTablePages['${key}']=${current+1};${draw}()">Next</button></div>`;
}
function pmsPaginateDom(key,tbodyId,signature,countId,pagerId,draw){
  const body=$(tbodyId);if(!body)return;
  const rows=[...body.querySelectorAll(':scope > tr')],empty=rows.length===1&&!!rows[0].querySelector('.empty');
  const total=empty?0:rows.length,page=pmsTablePage(key,total,signature),start=(page-1)*pmsPageSize;
  rows.forEach((row,i)=>{row.hidden=!empty&&(i<start||i>=start+pmsPageSize)});
  const count=$(countId);if(count)count.textContent=total?`Showing ${start+1}–${Math.min(start+pmsPageSize,total)} of ${total} records`:'Showing 0–0 of 0 records';
  const pager=$(pagerId);if(pager)pager.innerHTML=pmsPager(key,total,draw);
}

</script><script>/* One dashboard renderer; each role supplies its permitted records and panel configuration. */
let pmsDashboardCycle='all',pmsDashboardLoading=false;
let pmsDashboardFilters={period:'This Quarter',department:'All Departments',start:'',end:''};
function pmsDashboardRange(){
  const year=Number(urToday.slice(0,4)),month=Number(urToday.slice(5,7))-1,iso=d=>d.toISOString().slice(0,10),f=pmsDashboardFilters;
  if(f.period==='Custom Date Range')return {start:f.start,end:f.end,valid:!!f.start&&!!f.end&&f.start<=f.end};
  const first=f.period==='This Year'?0:f.period==='This Quarter'?Math.floor(month/3)*3:month,months=f.period==='This Year'?12:f.period==='This Quarter'?3:1;
  return {start:iso(new Date(Date.UTC(year,first,1))),end:iso(new Date(Date.UTC(year,first+months,0))),valid:true};
}

function pmsBuildShell(){
  const sidebar=document.querySelector('aside');
  sidebar.className='pms-sidebar';
  sidebar.innerHTML=`${pmsBrandLockup()}<div class="pms-company-host"><button id="pmsCompanyButton" class="pms-company-button" type="button" aria-haspopup="true" aria-expanded="false" onclick="pmsToggleCompany()"><span class="pms-company-avatar">MC</span><span class="pms-company-copy"><b>Mayon Consolidated Inc.</b><small>Main Company</small></span><i class="pms-company-status" aria-label="Active company"></i>${pmsChevron('pms-company-chevron')}</button><div id="pmsCompanyMenu" class="pms-company-menu" hidden></div></div><label class="pms-sidebar-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="pmsSidebarSearch" type="search" placeholder="Search..." aria-label="Search accessible pages" autocomplete="off" oninput="pmsSidebarSearchInput(this.value)"></label><div class="navlabel">WORKSPACE</div><nav id="nav" aria-label="Workspace navigation"></nav><div class="sidefoot"></div>`;
  pmsRenderCompany();
}
function pmsEnsurePageHeader(){
  let host=$('#pmsPageHeader');
  if(!host){host=document.createElement('div');host.id='pmsPageHeader';host.setAttribute('aria-label','Page header');$('.pms-topbar').insertAdjacentElement('afterend',host)}
  return host;
}
function pmsSplitPageHeader(){
  const host=pmsEnsurePageHeader(),content=$('#content');
  host.replaceChildren();
  if(!content)return;
  const dashboard=content.querySelector(':scope > .pms-dashboard');
  const pageHeader=dashboard?.querySelector(':scope > .pms-dash-header')||content.querySelector(':scope > .pagehead');
  if(pageHeader)host.appendChild(pageHeader);
  const filterError=dashboard?.querySelector(':scope > .pms-dash-filter-error');
  if(filterError)host.appendChild(filterError);
}
function pmsAccessiblePages(){
  const pages=roleNav().filter(([name])=>name!=='Reviews').map(([name])=>({label:name,parent:'',action:`navigate('${name}')`,icon:name}));
  if(urHr())pages.splice(2,0,{label:'All Reviews',parent:'Reviews',action:"urGoTab('Reviews')",icon:'Reviews'},{label:'Templates',parent:'Reviews',action:"urGoTab('Templates')",icon:'Reviews'},{label:'Cycles',parent:'Reviews',action:"urGoTab('Cycles')",icon:'Reviews'});
  else pages.splice(viewRole==='Manager'?3:2,0,{label:'Reviews',parent:'',action:"navigate('Reviews')",icon:'Reviews'});
  return pages;
}

/* Milestone interactions enhance the existing table without changing its columns or toolbar. */
const pmsExpandedGoals=new Set();
let pmsMilestonePending=null,pmsMilestoneEditor=null;
function pmsMilestoneToday(){const now=new Date();return [now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-')}
pmsGoalMilestones=function(g){return (g.milestones||[]).map((value,index)=>{const m=typeof value==='string'?{title:value,done:false}:value;return {...m,id:m.id||`goal-${g.id}-milestone-${index}`,due:m.due||'',completedAt:m.completedAt||null,done:!!m.done}})};
function pmsMilestoneState(m){return m.done?(m.due&&m.completedAt&&m.completedAt>m.due?'Completed (Late)':'Completed'):m.due&&m.due<pmsMilestoneToday()?'Overdue':'Pending'}
function pmsMilestonePercent(ms){return ms.length?Math.round(ms.filter(m=>m.done).length/ms.length*100):0}
function pmsMilestoneGoal(id){return scopedGoals().find(g=>String(g.id)===String(id))}
function pmsCanCompleteMilestones(g){return pmsCanUpdateGoalProgress(g)}
function pmsCanManageMilestones(g){return pmsCanConfigureGoal(g)}
function pmsMilestoneSignature(ms){return JSON.stringify(ms.map(m=>[m.title,m.due||'',!!m.done,m.completedAt||null]))}
function pmsGoalMutationSnapshot(g){return JSON.stringify([g.progress,g.trackingMode,pmsMilestoneSignature(pmsGoalMilestones(g))])}
function pmsSaveGoalPatch(id,patch,after,options={}){
  const g=pmsMilestoneGoal(id);if(!pmsCanCompleteMilestones(g))return;
  if(Object.keys(patch).some(key=>['createdBy','createdByName','createdAt','source','assignedBy','id'].includes(key)))return;
  if(patch.employee!==undefined||patch.ownerId!==undefined){const owner=pmsGoalCreateOwners().find(e=>patch.ownerId?e[0]===patch.ownerId:e[1]===patch.employee);if(!owner||patch.employee!==undefined&&owner[1]!==patch.employee)return}
  const old=pmsGoalMilestones(g),ms=patch.milestones||old,changed=pmsMilestoneSignature(old)!==pmsMilestoneSignature(ms);
  if(patch.progress!==undefined&&(!Number.isFinite(patch.progress)||patch.progress<0||patch.progress>100))return;

function pdStageRows(c,subject){return UR.assignments.filter(a=>a.cycle===c.id&&a.subject===subject)}
function pdUnlocked(a){const c=urCycle(a.cycle);if(!c?.stages||!a.stage)return true;const index=c.stages.findIndex(s=>s.id===a.stage);return index>=0&&c.stages.slice(0,index).every(s=>{const rows=pdStageRows(c,a.subject).filter(x=>x.stage===s.id);return rows.length>0&&rows.every(x=>['Submitted','Completed'].includes(x.state))})}
function pdGenerate(c){if(UR.assignments.some(a=>a.cycle===c.id))return;for(const stage of c.stages)for(const subject of c.participants){const template=(c.pendingSnapshots?.behavioral||UR.templates).find(t=>t.id===stage.behavioralTemplate)||{id:'none',name:'Goals performance only',description:'',version:1,sections:[],questions:[]};UR.assignments.push({id:urUid('rev'),cycle:c.id,subject,reviewer:pdStageReviewer(stage,subject),type:stage.type,stage:stage.id,deadline:stage.deadline,template:urClone(template),goalsTemplate:urClone((c.pendingSnapshots?.goals||UR.goalTemplates).find(t=>t.id===stage.goalsTemplate)||null),state:'Not Started',answers:{},actuals:{},updated:urToday})}}
urGenerateAssignments=function(c){return c.stages?pdGenerate(c):pdOld.generate(c)};
urCanEdit=function(a){return !!a&&pdUnlocked(a)&&pdOld.edit(a)};
urCanRead=function(a){if(!a)return false;if(!a.stage)return pdOld.read(a);if(a.reviewer===urUser())return true;return pdUnlocked(a)&&!urAnon(a)&&(urHr()||viewRole==='Manager'&&urTeam(a.subject)||urCycle(a.cycle).released&&a.subject===urUser())};
urEffective=function(a){return a.stage&&!pdUnlocked(a)?'Locked':pdOld.effective(a)};
urStartWizard=function(id,fresh=false){if(id&&urCycle(id)?.status!=='Draft')return;pdView='';pdOld.start(id,fresh);if(!urHr()||!urWizard)return;if(!id&&!urWizard.stages){urWizard.stages=['Self','Manager','HR'].map((type,i)=>({id:urUid('stage'),name:pdLabel[type],type,reviewer:type==='HR'?'HR-001':'',deadline:['2026-11-06','2026-11-11','2026-11-15'][i],goalsTemplate:'',behavioralTemplate:''}));urWizard.deadline='2026-11-15';urWizard.weights={goals:60,behavioral:40};render()}};
function pdCycleErrors(c,step=6){const errors=[];if(!c.name.trim())errors.push('Enter a cycle name.');if(!c.periodStart||!c.periodEnd||c.periodStart>c.periodEnd)errors.push('Check the evaluation period.');if(!c.start||!c.deadline||c.start>c.deadline)errors.push('Check the cycle operating dates.');if(step>=2&&(!c.participants.length||c.participants.some(id=>!pdScopedEmployees().some(e=>e[0]===id))))errors.push('Select authorized employees.');if(step>=3){if(!c.stages?.length)errors.push('Add at least one assessment stage.');for(const [i,stage] of (c.stages||[]).entries()){if(!stage.name.trim()||!['Self','Manager','HR','Peer','Upward'].includes(stage.type))errors.push('Enter each stage name and type.');if(!stage.deadline||stage.deadline<c.start||stage.deadline>c.deadline||i&&stage.deadline<=c.stages[i-1].deadline)errors.push('Each stage needs a deadline within operating dates, strictly after its preceding stage.')}}if(step>=4){for(const stage of c.stages){for(const subject of c.participants){const reviewer=pdStageReviewer(stage,subject);if(!urPeople().some(p=>p.id===reviewer)||stage.type==='Self'&&reviewer!==subject||stage.type!=='Self'&&reviewer===subject||stage.type==='HR'&&reviewer!=='HR-001')errors.push('Assign a valid evaluator for every employee and stage.')}if(!stage.goalsTemplate&&!stage.behavioralTemplate)errors.push('Choose at least one template for each stage.');const g=UR.goalTemplates.find(t=>t.id===stage.goalsTemplate),b=UR.templates.find(t=>t.id===stage.behavioralTemplate);if(stage.goalsTemplate&&(!g||g.status!=='Published'||pdGoalTemplateErrors(g,true).length))errors.push('Select a valid published KPI Goal Template.');if(stage.behavioralTemplate&&(!b||b.status!=='Published'||urTemplateErrors(b,true).length))errors.push('Select a valid published Behavioral Assessment Template.')}if(!c.weights||!Number.isFinite(c.weights.goals)||!Number.isFinite(c.weights.behavioral)||c.weights.goals<0||c.weights.behavioral<0||c.weights.goals+c.weights.behavioral!==100)errors.push('Goals and Behavioral weights must total 100%.')}return [...new Set(errors)]}
urCycleValidation=function(c,step){return c.stages?pdCycleErrors(c,step||6):pdOld.validation(c,step)};
function pdSetStage(i,key,value){urWizard.stages[i][key]=value;urDirty=true}
function pdMoveStage(i,delta){const list=urWizard.stages;if(!list[i+delta])return;[list[i],list[i+delta]]=[list[i+delta],list[i]];urDirty=true;render()}
function pdNextStep(step){if(step>urStep){const errors=pdCycleErrors(urWizard,step-1);if(errors.length){$('#urWizardError').textContent=errors.join(' ');return}}urStep=step;render()}
function pdStageConfig(c,templates){return c.stages.map((stage,i)=>`<section class="panel pd-form"><div class="pd-section-head"><h3>${i+1}. ${esc(stage.name)}</h3><div>${!templates?`<button aria-label="Move stage up" ${i===0?'disabled':''} onclick="pdMoveStage(${i},-1)">↑</button><button aria-label="Move stage down" ${i===c.stages.length-1?'disabled':''} onclick="pdMoveStage(${i},1)">↓</button><button onclick="urWizard.stages.splice(${i},1);urDirty=true;render()">Remove</button>`:''}</div></div><div class="formgrid">${!templates?`<label>Stage Name *<input value="${esc(stage.name)}" oninput="pdSetStage(${i},'name',this.value)"></label><label>Assessment Type<select onchange="pdSetStage(${i},'type',this.value);pdSetStage(${i},'reviewer',this.value==='HR'?'HR-001':'');render()">${pdOptions(['Self','Manager','HR','Peer','Upward'],stage.type)}</select></label><label>Stage Deadline *<input type="date" value="${stage.deadline}" min="${c.start}" max="${c.deadline}" onchange="pdSetStage(${i},'deadline',this.value)"></label>`:`<label>KPI Goal Template<select onchange="pdSetStage(${i},'goalsTemplate',this.value)"><option value="">Not applicable</option>${UR.goalTemplates.filter(t=>t.status==='Published').map(t=>`<option value="${t.id}" ${stage.goalsTemplate===t.id?'selected':''}>${esc(t.name)} · ${esc(t.position)} · v${t.version}</option>`).join('')}</select></label><label>Behavioral Assessment Template<select onchange="pdSetStage(${i},'behavioralTemplate',this.value)"><option value="">Not applicable</option>${UR.templates.filter(t=>t.status==='Published').map(t=>`<option value="${t.id}" ${stage.behavioralTemplate===t.id?'selected':''}>${esc(t.name)} · v${t.version} — ${esc(urTemplateDescription(t))}</option>`).join('')}</select></label>`}</div>${templates?`<div class="pd-evaluators">${c.participants.map(subject=>`<label>${esc(urPerson(subject).name)} — Assigned Evaluator${['Self','Manager'].includes(stage.type)?`<input readonly value="${esc(urPerson(pdStageReviewer(stage,subject)).name)}">`:`<select onchange="urWizard.stages[${i}].reviewers??={};urWizard.stages[${i}].reviewers['${subject}']=this.value;urDirty=true"><option value="">Select evaluator</option>${urPeople().filter(p=>p.id!==subject&&(stage.type!=='HR'||p.id==='HR-001')).map(p=>`<option value="${p.id}" ${pdStageReviewer(stage,subject)===p.id?'selected':''}>${esc(p.name)} · ${esc(p.position)}</option>`).join('')}</select>`}</label>`).join('')}</div>`:''}</section>`).join('')+(!templates?'<button onclick="urWizard.stages.push({id:urUid(\'stage\'),name:\'Peer Assessment\',type:\'Peer\',deadline:\'\',reviewer:\'\',goalsTemplate:\'\',behavioralTemplate:\'\'});urDirty=true;render()">+ Add Assessment Stage</button>':'')}
urWizardPage=function(){if(!urWizard?.stages)return pdOld.wizard();const c=urWizard,steps=['General Information','Select Employees','Assessment Sequence','Evaluators & Templates','Scoring','Review & Launch'];let body='';if(urStep===1)body=`<div class="formgrid">${[['Cycle Name','name','text'],['Description','description','textarea'],['Review Period Start','periodStart','date'],['Review Period End','periodEnd','date'],['Cycle Start','start','date'],['Cycle Deadline','deadline','date']].map(([label,key,type])=>`<label>${label}${key==='description'?'':' *'}${type==='textarea'?`<textarea rows="3" oninput="urSetCycle('${key}',this.value)">${esc(c[key])}</textarea>`:`<input type="${type}" value="${esc(c[key])}" onchange="urSetCycle('${key}',this.value)">`}</label>`).join('')}<label>Review Type<select onchange="urSetCycle('type',this.value)">${pdOptions(['Standard Performance Review','360° Feedback','Probationary Review','Project-Based Review'],c.type)}</select></label></div>`;else if(urStep===2)body=`<div class="toolbar urtoolbar"><label>Search employees<input class="search" value="${esc(urEmployeeSearch)}" oninput="urEmployeeSearch=this.value;urDrawEmployeeLookup()"></label><span id="urSelectedCount"></span></div><div class="tablewrap"><table><thead><tr><th>SELECT</th><th>EMPLOYEE</th><th>ID</th><th>DEPARTMENT</th><th>POSITION</th><th>MANAGER</th></tr></thead><tbody id="urEmployeeLookup"></tbody></table></div>${pmsListFooter('pmsWizardEmployeeCount','pmsWizardEmployeePager')}`;else if(urStep===3||urStep===4)body=pdStageConfig(c,urStep===4)+(urStep===4?`<section class="panel pd-form"><h3>Feedback Confidentiality</h3><label class="urcheck"><input type="checkbox" ${c.anonymousPeer?'checked':''} onchange="urSetCycle('anonymousPeer',this.checked)">Anonymous Peer Feedback</label><label class="urcheck"><input type="checkbox" ${c.anonymousUpward?'checked':''} onchange="urSetCycle('anonymousUpward',this.checked)">Anonymous Upward Feedback</label><label>Minimum Anonymous Responses<input type="number" min="2" max="10" value="${c.threshold}" onchange="urSetCycle('threshold',Number(this.value))"></label></section>`:'');else if(urStep===5)body=`<p>Cycle-specific dimension weights. A stage using only one dimension is scored solely on that dimension.</p><div class="formgrid">${['goals','behavioral'].map(key=>`<label>${key==='goals'?'Goals Performance':'Behavioral Performance'} (%)<input type="number" min="0" max="100" value="${c.weights[key]}" onchange="urWizard.weights.${key}=Number(this.value);urDirty=true"></label>`).join('')}</div><p class="urmuted">Behavioral scores average observed numerical answers. Indicator scores use the selected template criteria and weights. Stage results remain separate; the last applicable submitted stage supplies each final dimension.</p>`;else body=`<h2>${esc(c.name)}</h2><p>${c.participants.length} employees · ${c.stages.length} stages · Goals ${c.weights.goals}% / Behavioral ${c.weights.behavioral}%</p>${pdStageTimeline(c,c.participants[0],true)}<div class="notice">Only the first stage is initially available per employee. Submission unlocks the next stage; finalization and result release remain separate HR actions.</div>`;return pdBack("urGoTab('Cycles')",'Back to Cycles')+pdHead('Create Review Cycle','Configure sequential assessments, evaluators, templates, and individual deadlines.')+`<div class="urstepper pd-wizard-steps">${steps.map((name,i)=>`<button class="${urStep===i+1?'active':''}" onclick="pdNextStep(${i+1})"><span>${i+1}</span>${name}</button>`).join('')}</div><section class="panel urwizardpanel"><div class="panelhead"><div><small>STEP ${urStep} OF 6</small><h2>${steps[urStep-1]}</h2></div></div><div class="urwizardbody">${body}</div><div class="urerror" id="urWizardError" role="alert"></div><div class="urwizardfoot"><button onclick="urSaveCycleDraft()">Save as Draft</button>${urStep>1?`<button onclick="pdNextStep(${urStep-1})">Back</button>`:''}${urStep<6?`<button class="primary" onclick="pdNextStep(${urStep+1})">Continue</button>`:`<button class="primary" onclick="urConfirmCycle('${c.start>urToday?'Scheduled':'Active'}')">${c.start>urToday?'Schedule':'Launch'} Cycle</button>`}</div></section>`};
urCommitCycle=function(state){if(!urWizard?.stages)return pdOld.commit(state);if(!urHr()||!['Active','Scheduled'].includes(state)||pdCycleErrors(urWizard).length)return;const c=urClone(urWizard);c.status=state;c.groups=[...new Set(c.stages.map(s=>s.type))];c.evaluators=c.stages.flatMap(s=>c.participants.map(subject=>({subject,type:s.type,reviewer:pdStageReviewer(s,subject)})));c.templates={};c.stageSnapshots=urClone(c.stages);const index=UR.cycles.findIndex(x=>x.id===c.id);if(index>=0&&UR.assignments.some(a=>a.cycle===c.id))return;if(index>=0)UR.cycles[index]=c;else UR.cycles.push(c);if(state==='Active')pdGenerate(c);else c.pendingSnapshots={goals:urClone(UR.goalTemplates),behavioral:urClone(UR.templates)};UR.draftCycle=null;urDirty=false;urAudit('Sequential cycle '+state+': '+c.id);closeModal();urDetail=c.id;urDetailTab='Overview';urScreen='cycle';render();toast('Sequential cycle saved')};
function pdStageTimeline(c,subject,config=false){return `<ol class="pd-stages" aria-label="Assessment sequence">${c.stages.map((stage,i)=>{const a=pdStageRows(c,subject).find(a=>a.stage===stage.id),status=config?'Configured':a?.state==='Completed'&&a.submitted?'Submitted':a?urEffective(a):'Not Started';return `<li class="${status==='Locked'?'pd-locked':''}"><span class="pd-stage-number">${i+1}</span><div><b>${esc(stage.name)}</b><small>${esc(a&&urAnon(a)&&a.reviewer!==urUser()?'Anonymous evaluator':urPerson(a?.reviewer||pdStageReviewer(stage,subject)).name)}</small><small>Due ${date(stage.deadline)}</small>${urBadge(status)}${status==='Locked'?'<small>Awaiting previous assessment</small>':a?.submitted?`<small>Submitted ${date(a.submitted)}</small>`:''}${!config&&a&&urCanRead(a)?`<button class="textbtn" onclick="urOpenReview('${a.id}')">${urCanEdit(a)?'Continue Assessment':'View Assessment'}</button>`:''}</div></li>`}).join('')}</ol>`}
function pdAchievement(x,actual){if(actual==null||actual==='')return '—';const n=Number(actual);return x.direction==='Lower'?(n<=x.target?'Target Met':'Above maximum'):x.target===0?(n>=0?'Target Met':'Below target'):(n/x.target*100).toFixed(1)+'%'}
function pdIndicatorScore(x,actual){return actual==null||actual===''?null:(x.direction==='Lower'?Number(actual)<=x.target:Number(actual)>=x.target)?x.scoreMet:x.scoreBelow}
function pdGoalsScore(a,actuals=a.actuals){if(!a.goalsTemplate)return null;const rows=a.goalsTemplate.indicators.filter(x=>actuals[x.id]!=null&&actuals[x.id]!==''),weight=rows.reduce((n,x)=>n+x.weight,0);return weight?rows.reduce((n,x)=>n+pdIndicatorScore(x,actuals[x.id])*x.weight,0)/weight:null}
function pdWeighted(goals,behavioral,weights){if(goals==null)return behavioral;if(behavioral==null)return goals;return (goals*weights.goals+behavioral*weights.behavioral)/100}
urMean=function(a){return a.stage?pdWeighted(pdGoalsScore(a),pdOld.mean(a),urCycle(a.cycle).weights):pdOld.mean(a)};
function pdQuantitative(a,readonly=false,actuals=pdActuals){if(!a.goalsTemplate)return '';return `<section class="panel"><div class="panelhead"><div><h2>Goals Performance</h2><p>${esc(a.goalsTemplate.name)} · v${a.goalsTemplate.version} · ${esc(a.goalsTemplate.position)}</p></div></div><div class="tablewrap"><table><thead><tr><th>INDICATOR</th><th>TARGET</th><th>ACTUAL RESULT</th><th>ACHIEVEMENT</th><th>SCORE</th></tr></thead><tbody>${a.goalsTemplate.indicators.map(x=>`<tr><td><b>${esc(x.name)}</b><small>${esc(x.description)} · ${x.weight}% weight</small>${typeof mxIndicatorReference==='function'?mxIndicatorReference(x):''}</td><td>${x.direction==='Lower'?'Maximum ':''}${x.target}${x.unit==='Percentage'?'%':' '+esc(x.unit)}</td><td>${readonly?esc(String(actuals[x.id]??'—')):`<input class="pd-actual" type="number" min="0" step="any" aria-label="Actual result: ${esc(x.name)}" value="${esc(String(actuals[x.id]??''))}" oninput="pdActuals['${x.id}']=this.value;urDirty=true;pdRefreshScores()">`}</td><td data-pd-achievement="${x.id}">${pdAchievement(x,actuals[x.id])}</td><td data-pd-score="${x.id}">${urRating(pdIndicatorScore(x,actuals[x.id]))}</td></tr>`).join('')}</tbody></table></div><p class="pd-score-note">Scores follow each indicator’s configured criteria. An enabled numeric matrix uses its minimum thresholds; other indicators use target-met / below-target scores.</p></section>`}
function pdRefreshScores(){const a=UR.assignments.find(x=>x.id===urDetail);if(!a?.goalsTemplate)return;for(const x of a.goalsTemplate.indicators){const score=document.querySelector(`[data-pd-score="${x.id}"]`),ach=document.querySelector(`[data-pd-achievement="${x.id}"]`);if(score)score.textContent=urRating(pdIndicatorScore(x,pdActuals[x.id]));if(ach)ach.textContent=pdAchievement(x,pdActuals[x.id])}}
urOpenReview=function(id){const a=UR.assignments.find(x=>x.id===id);if(!a?.stage)return pdOld.open(id);if(!urVisible(a)||!urCanRead(a))return;urGo(()=>{pdActuals=urClone(a.actuals||{});pdFeedback=a.feedback||'';pdView='';page='Reviews';urTab='Reviews';urScreen='review';urDetail=id;urAnswers=urClone(a.answers);urDirty=false;render()})};
urReviewDetail=function(){const a=UR.assignments.find(x=>x.id===urDetail);if(!a?.stage)return pdOld.detail();if(!urVisible(a)||!urCanRead(a))return urEmpty('Review unavailable','This review is outside your permissions.');const c=urCycle(a.cycle),editable=urCanEdit(a),stage=c.stages.find(s=>s.id===a.stage);return pdBack("urGoTab('Reviews')",'Back to Reviews')+pdHead('Review Details',urPerson(a.subject).name+' · '+stage.name,c.released&&urCanResult(c,a.subject)?`<button class="primary" onclick="urOpenResult('${c.id}','${a.subject}')">View Released Results</button>`:'')+`<section class="panel pd-form">${pdStageTimeline(c,a.subject)}</section>${!pdUnlocked(a)?'<div class="notice">Locked — Awaiting Previous Assessment. A missed deadline does not unlock this stage.</div>':`<div class="notice">${editable?'Complete the applicable sections and submit to unlock the next assessment.':'This assessment is read-only.'} Due ${date(a.deadline)} · ${urBadge(urEffective(a))}</div>${pdQuantitative(a,!editable,editable?pdActuals:a.actuals)}${a.template.questions.length?`<section class="panel pd-form"><h2>Behavioral Performance</h2><p>${esc(a.template.name)} · v${a.template.version}</p>${urQuestionFields(a.template,urAnswers,!editable)}</section>`:''}${editable?`<section class="panel pd-form"><label>Evaluator Summary (optional)<textarea rows="4" maxlength="3000" oninput="pdFeedback=this.value;urDirty=true">${esc(pdFeedback)}</textarea></label></section><div id="urValidation" class="urerror" role="alert"></div><div class="pd-form-footer"><button onclick="urSaveResponse()">Save Draft</button><button class="primary" onclick="urConfirmSubmit()">Submit Assessment</button></div>`:''}${urHr()&&a.state==='Submitted'&&c.status==='Active'?`<button onclick="urReopen('${a.id}')">Reopen Assessment</button>`:''}`}`};
function pdActualErrors(a){return (a.goalsTemplate?.indicators||[]).filter(x=>pdActuals[x.id]==null||pdActuals[x.id]===''||!Number.isFinite(Number(pdActuals[x.id]))||Number(pdActuals[x.id])<0).map(x=>'Enter a valid actual result for '+x.name+'.')}
urSaveResponse=function(){const a=UR.assignments.find(x=>x.id===urDetail);if(a?.stage&&urCanEdit(a)){if(Object.values(pdActuals).some(v=>v!==''&&(!Number.isFinite(Number(v))||Number(v)<0))){toast('Actual results must be nonnegative numbers.');return}a.actuals=urClone(pdActuals);a.feedback=pdFeedback.trim()}pdOld.saveResponse()};
urConfirmSubmit=function(){const a=UR.assignments.find(x=>x.id===urDetail);if(a?.stage){const errors=pdActualErrors(a);if(errors.length){$('#urValidation').textContent=errors.join(' ');return}}pdOld.confirm()};
urSubmitResponse=function(){const a=UR.assignments.find(x=>x.id===urDetail);if(a?.stage){if(!urCanEdit(a)||pdActualErrors(a).length||a.template.questions.some(q=>q.required&&!String(urAnswers[q.id]??'').trim()))return;a.actuals=urClone(pdActuals);a.feedback=pdFeedback.trim()}pdOld.submit()};
urReopen=function(id){
 const a=UR.assignments.find(x=>x.id===id),c=a&&urCycle(a.cycle);if(!c?.stages)return pdOld.reopen(id);
 if(!urHr()||!urVisible(a)||a.state!=='Submitted'||c.status!=='Active'||c.released)return;
 const index=c.stages.findIndex(s=>s.id===a.stage),affected=pdStageRows(c,a.subject).filter(x=>c.stages.findIndex(s=>s.id===x.stage)>=index);
 modal('Correct Assessment Sequence',urPerson(a.subject).name+' · '+c.name,`<form onsubmit="event.preventDefault();pdConfirmReopen('${id}',this.reason.value)"><div class="modalbody"><p>The selected assessment and any later responses return to drafts. Previous responses are preserved in correction history. Evaluators must submit again in sequence before HR can finalize.</p><p>${affected.length} assignment(s) affected. Accomplishment verification is preserved; this action corrects assessment responses.</p><label>Reason for Correction <span class="required">*</span><textarea name="reason" required maxlength="2000" rows="3"></textarea></label><p id="pd-correction-error" class="cw-error" role="alert"></p></div><div class="modalfoot"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Reopen Assessment Sequence</button></div></form>`,'');
};
function pdConfirmReopen(id,reason){
 const a=UR.assignments.find(x=>x.id===id),c=a&&urCycle(a.cycle);reason=String(reason||'').trim();
 if(!urHr()||!a||!urVisible(a)||!c?.stages||c.status!=='Active'||c.released||a.state!=='Submitted')return;
 if(!reason||reason.length>2000){$('#pd-correction-error').textContent='Enter a reason for correction (up to 2,000 characters).';return}
 const index=c.stages.findIndex(s=>s.id===a.stage);if(index<0)return;
 const at=pdNow();for(const row of pdStageRows(c,a.subject).filter(x=>c.stages.findIndex(s=>s.id===x.stage)>=index)){
  row.responseHistory??=[];row.responseHistory.push({state:row.state,answers:urClone(row.answers),actuals:urClone(row.actuals||{}),feedback:row.feedback||'',submitted:row.submitted,reason,by:urUser(),at});
  row.state=row.id===a.id||row.state!=='Not Started'?'In Progress':'Not Started';delete row.submitted;row.correctionReason=reason;row.updated=urToday;
 }
 urAudit('Assessment sequence reopened: '+id+' — '+reason);closeModal();render();toast('Responses preserved; assessments must be submitted again in sequence');
